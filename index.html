function renderSessionBody(key, session, welcomeBack){
  var html = "";
  var comp = completionOn(TKEY);
  // The short version keeps the original slot indexes, so anything she already logged
  // survives switching either way — and switching back is lossless.
  var sv = session.shortVersion;
  var isShort = sv && shortOnToday();
  var slots = [];
  session.exercises.forEach(function(slot, i){
    if(!isShort || sv.keep.indexOf(i) >= 0) slots.push({ slot: slot, i: i });
  });
  function setsFor(slot){
    var n = slotSets(slot, welcomeBack, WEEKCLAMP);
    return isShort ? Math.min(sv.sets, n) : n;
  }
  var totalEx = slots.length;
  var doneEx = 0;
  slots.forEach(function(p){
    if((S.setDone[checkKey(key, p.slot.exerciseId, p.i)]||0) >= setsFor(p.slot)) doneEx++;
  });
  var pct = totalEx ? Math.round(doneEx / totalEx * 100) : 0;
  RENDER_PCT = pct;

  if(!comp){
    html += '<div class="progressbar"><div class="progressfill" id="pfill" style="width:' + pct + '%"></div></div>';
    html += '<div class="progresslabel">' + (doneEx === totalEx && totalEx > 0 ? "All " + totalEx + " done" : doneEx + " of " + totalEx + " done") + '</div>';
    if(welcomeBack) html += '<div class="banner"><h2>Lighter on purpose</h2><p>' + esc(DATA.copy.welcomeBackNote) + '</p></div>';
    else if(WEEKCLAMP === 1 && WEEK >= 1) html += '<div class="banner"><h2>Week one</h2><p>' + esc(DATA.copy.week1Note) + '</p></div>';
    if(STEADY && STEADY_CFG.headline) html += '<div class="banner steady"><h2>' + esc(STEADY_CFG.headline) + '</h2><p>' +
      esc(STEADY_CFG.note || "") + '</p></div>';
    if(isShort && DATA.copy.shortCard) html += '<div class="banner short"><h2>' + esc(DATA.copy.shortCard.title) + '</h2><p>' +
      esc(DATA.copy.shortCard.note) + '</p><div class="ex-actions"><button class="mini" data-short="off">' +
      esc(DATA.copy.shortCard.undo) + '</button></div></div>';
    html += '<div class="warm">Warm-up: ' + esc(session.warmup) + '</div>';
    if(!S.workStart[TKEY]) html += '<button class="donebtn" data-start-workout>Start workout ▶</button>';
  }

  var cards = "";
  slots.forEach(function(pair){
    var slot = pair.slot, i = pair.i;
    var exId = slot.exerciseId;
    applyDropIfPending(exId, slot);
    applyBumpIfPending(exId, slot);
    var wasBumpedToday = (S.bumpedToday||{})[TKEY+"|"+exId];
    var wasDroppedToday = (S.droppedToday||{})[TKEY+"|"+exId];
    var ex = DATA.exercises[exId];
    var ck = checkKey(key, exId, i);
    var sets = setsFor(slot);
    var doneSets = Math.min(S.setDone[ck]||0, sets);
    var checked = doneSets >= sets;
    var amrapOn = !isShort && showAmrapFor(slot, welcomeBack, WEEKCLAMP);
    var partial = doneSets > 0 && !checked;
    var ringStyle = partial ? ' style="background:conic-gradient(var(--good) ' + Math.round(doneSets/sets*100) + '%, var(--accent-soft) 0)"' : '';

    cards += '<div class="card' + (checked?' checked':'') + (checked && JUST.check === ck ? ' just' : '') + '">';
    cards += '<div class="ex-top"><button class="check' + (partial?' partial':'') + '" data-ck="'+ck+'" data-sets="'+sets+'"' + ringStyle +
      ' aria-label="log a set" aria-pressed="' + checked + '">' + (checked ? "✓" : (partial ? doneSets+"/"+sets : "")) + '</button><div style="flex:1">';
    cards += '<div class="ex-name">' + esc(ex.name) + '</div>';
    cards += '<div class="ex-rx">' + esc(sets + " × " + (slot.work.type === "time"
      ? slot.work.seconds + " seconds" : slotReps(slot, WEEKCLAMP)) + (slot.work.perSide ? " each side" : "")) + '</div>';
    cards += '<div class="ex-weight">' + esc(currentWeight(exId, slot)) + '</div>';
    // where she started, once she's actually moved — gets better every week for twelve weeks
    var stIdx = startIndex(exId, slot);
    if(rungIndex(exId, slot) > stIdx && DATA.copy.startedAt)
      cards += '<div class="ex-note startedat">' + esc(subst(DATA.copy.startedAt, { from: DATA.exercises[exId].ladder[stIdx] })) + '</div>';
    if(slot.note) cards += '<div class="ex-note">' + esc(slot.note) + '</div>';
    if(wasBumpedToday) cards += '<div class="ex-bump">' + esc(DATA.copy.bumpUp) + '</div>';
    if(wasDroppedToday) cards += '<div class="ex-bump">' + esc(DATA.copy.dropDown) + '</div>';
    if(amrapOn) cards += '<div class="ex-bump">' + esc(DATA.copy.amrapNote) + '</div>';
    cards += '<div class="ex-actions">';
    var easyOn = !!S.easyTap[exId];
    var heavyOn = !!S.heavyTap[exId];
    cards += '<button class="mini' + (easyOn?' active':'') + '" data-easy="'+exId+'">' + (easyOn ? "✓ heavier next time" : "↑ too easy") + '</button>';
    cards += '<button class="mini' + (heavyOn?' active':'') + '" data-heavy="'+exId+'">' + (heavyOn ? "✓ lighter next time" : "↓ felt heavy") + '</button>';
    var running = TIMER && TIMER.ck === ck && !TIMER.done;
    var tdone = TIMER && TIMER.ck === ck && TIMER.done;
    var restSecs = slotRest(slot);
    cards += '<button class="mini timer' + (running?' running':'') + (tdone?' done':'') + '" data-timer="'+ck+'" data-secs="'+restSecs+'">' +
      (tdone ? "Go 💪" : (running ? "⏱ " + fmtSecs(Math.max(0, Math.ceil((TIMER.endAt - Date.now())/1000))) : "⏱ rest " + fmtSecs(restSecs))) + '</button>';
    if(wasBumpedToday) cards += '<button class="mini" data-hold="'+exId+'">↩ keep last weight</button>';
    cards += '</div>';
    // Ninety seconds of staring at nothing is the best real estate in the app.
    if(running || tdone){
      var rp = photoFrom("rest", (S.restShown || 0) + i);
      if(rp) cards += '<div class="restphoto">' + photoTag(rp, "rp", "you two") +
        '<div class="restcap">' + (tdone ? "Go 💪" : "Rest.") + '</div></div>';
    }
    cards += howtoBlock(ex, slot, exId);
    cards += '</div></div></div>';
  });

  var fin = session.optionalFinisher;
  if(!isShort && showFinisher(fin, welcomeBack, WEEKCLAMP)){
    var fex = DATA.exercises[fin.exerciseId];
    cards += '<div class="card"><div class="ex-top"><div style="flex:1">';
    cards += '<div class="ex-name">Optional finisher: ' + esc(fex.name) + '</div>';
    cards += '<div class="ex-rx">' + esc(rxText(fin, false, WEEKCLAMP)) + ' · ' + esc(currentWeight(fin.exerciseId, fin)) + '</div>';
    cards += '<div class="ex-note">Only if you\u2019re feeling it. Skipping it costs you nothing.</div>';
    cards += '<details><summary>How do I do this?</summary><div class="howto"><p>' + esc(fex.setup) + ' ' + esc(fex.how) + '</p></div></details>';
    cards += '</div></div></div>';
  }

  if(comp){
    var n = totalCount();
    html += '<div class="celebrate' + (JUST.finished ? ' just' : '') + '" id="celebrate">';
    var cp = photoFrom("celebrate", n);
    if(cp) html += '<div class="celebphoto">' + photoTag(cp, "cp", "you two") + '</div>';
    html += '<div class="bignum">' + n + '</div>';
    html += '<div class="biglabel">workout' + (n === 1 ? '' : 's') + ' — this number only goes up</div>';
    html += '<h2>' + esc(pickCelebration()) + '</h2>';
    var nl = nextLiftDate();
    html += '<p>' + (welcomeBack ? esc(DATA.copy.welcomeBackDone) : (nl ? "See you " + esc(nl.toLocaleDateString("en-US",{weekday:"long"})) + "." : "")) + '</p>';
    // gym days get the same "how'd it go" taps class days already have — the one signal
    // the coach has no other way to get, and it never becomes a score anywhere
    if(DATA.sessions.open && DATA.sessions.open.efforts){
      html += '<p class="ex-note" style="margin-top:10px">' + esc(DATA.copy.feelPrompt || "How'd that one go?") + '</p>';
      html += '<div class="effortrow" role="group">';
      DATA.sessions.open.efforts.forEach(function(ef){
        html += '<button class="effort' + (S.feel[TKEY] === ef.id ? " on" : "") + '" data-feel="' + ef.id + '">' +
          '<span class="em">' + ef.emoji + '</span>' + esc(ef.label) + '</button>';
      });
      html += '</div>';
    }
    html += '<div class="ex-actions" style="justify-content:center"><button class="mini" data-undo-finish>Undo</button></div>';
    html += '</div>';
    var sumBits = [esc(session.title) + " ✓"];
    if(comp.dur) sumBits.push(comp.dur + " min");
    if(comp.vol) sumBits.push(comp.vol.toLocaleString() + " lb moved");
    var revOpen = (window.__open||{})["review"];
    html += '<details class="summarystrip" data-ho="review"' + (revOpen ? " open" : "") + '><summary>' + sumBits.join(" · ") + ' — review</summary>' + cards + '</details>';
  } else {
    html += cards;
    var remaining = totalEx - doneEx;
    html += '<button class="donebtn" id="finish"' + (remaining === 0 ? "" : " disabled") + '>' +
      (remaining === 0 ? "Finish session" : remaining + " exercise" + (remaining===1?"":"s") + " left") + '</button>';
    html += '<div class="uncheck-hint">Tap the circle after each set — it fills as you go. Tap a full circle to reset it.</div>';
    // The smaller door. Offered quietly, never as a suggestion that she should need it.
    if(sv && !isShort && DATA.copy.shortNudge && DATA.copy.shortCard){
      var openShort = (window.__open||{})["shortcard"];
      html += '<details class="shortoffer" data-ho="shortcard"' + (openShort ? " open" : "") + '><summary>' +
        esc(DATA.copy.shortNudge) + '</summary><div class="card"><h3 class="ptitle">' + esc(DATA.copy.shortCard.title) + '</h3>' +
        '<p>' + esc(DATA.copy.shortCard.body) + '</p><div class="exlist">' +
        esc(sv.keep.map(function(ix){ return DATA.exercises[session.exercises[ix].exerciseId].name; }).join(" · ")) + '</div>' +
        '<p class="ex-note" style="margin-top:8px">' + esc(DATA.copy.shortCard.note) + '</p>' +
        '<button class="donebtn" data-short="on">' + esc(DATA.copy.shortCard.button) + '</button></div></details>';
    }
  }
  return html;
}

/* ---------- SCHEDULE ---------- */
function renderPlan(){
  var view = S.prefs.planView === "month" ? "month" : "weeks";
  var html = '<div class="pagehead"><h1>Your schedule</h1><p>' +
    (view === "month" ? 'Your whole program as a calendar — tap any day to see its workout.' :
      'All ' + DATA.meta.programWeeks + ' weeks. Your week is open below — tap any other week to unfold it, and any day to see the workout.') + '</p></div>';
  html += '<div class="planbar"><div class="viewtoggle">' +
    '<button class="vbtn' + (view==="weeks"?" on":"") + '" data-view="weeks">Weeks</button>' +
    '<button class="vbtn' + (view==="month"?" on":"") + '" data-view="month">Months</button></div>' +
    '<button class="histbtn" data-nav="history">🕘 History</button></div>';
  if(view === "month"){
    html += renderPlanMonth();
    html += footerBlock();
    return html;
  }
  var lastMonth = -1;
  for(var w = 1; w <= DATA.meta.programWeeks; w++){
    var monday = new Date(START); monday.setDate(START.getDate() + (w-1)*7);
    if(monday.getMonth() !== lastMonth){
      lastMonth = monday.getMonth();
      html += '<div class="monthhead">' + MONTHS[lastMonth] + ' ' + monday.getFullYear() + '</div>';
    }
    var block = blockFor(w);
    var isCur = (w === WEEK) || (WEEK < 1 && w === 1);
    var dots = "";
    var rows = "";
    for(var i=0;i<7;i++){
      var d = new Date(monday); d.setDate(monday.getDate()+i);
      var k = dateKey(d);
      var base = layoutFor(w)[DAYNAMES[d.getDay()]];
      var key = OVR[k] || base;
      var moved = key !== base;
      var comp = completionOn(k);
      var isClass = comp && comp.session === "sculpt";
      dots += '<span class="md' + (comp ? (isClass?" cl":" dn") : (isLift(key) ? " l" : (key === "open" ? " o" : ""))) + '"></span>';
      var session = DATA.sessions[key];
      var cls = "dayrow " + (isLift(key) ? "islift" : (key === "rest" ? "isrest" : "isopen")) + (k === TKEY ? " istoday" : "");
      var label = isLift(key) ? session.title :
        (key === "rest" ? (moved ? "Rest — this week" : "Rest — always off") :
          (key === "open" ? "Class day — Sculpt when you book it" : (session.title || "")));
      var mark = comp ? (isClass ? '<span class="dmark fl">🔥 class</span>' : '<span class="dmark">✓ done</span>') :
        (k === TKEY ? '<span class="dmark">today</span>' : (moved ? '<span class="dmark">↷ moved</span>' : '<span class="dmark"></span>'));
      rows += '<button class="' + cls + '" data-day="' + k + '"><span class="dnum">' + FULLSHORT[d.getDay()] + ' ' + d.getDate() + '</span>' +
        '<span class="dsess">' + esc(label) + '</span>' + mark + '</button>';
    }
    var wkOpen = isCur || !!(window.__open||{})["wk-"+w];
    html += '<details class="weekcard" id="wk-'+w+'" data-ho="wk-'+w+'"' + (wkOpen ? " open" : "") + '><summary><span class="wnum">Week ' + w + '</span>' +
      '<span class="wblock">' + esc(block.name) + '</span><span class="minidots">' + dots + '</span></summary>' +
      '<div class="wc-body">' + rows + '</div></details>';
  }
  html += footerBlock();
  return html;
}

function renderPlanMonth(){
  var html = "";
  var anyMoved = false;
  var endD = new Date(START); endD.setDate(START.getDate() + DATA.meta.programWeeks*7 - 1);
  var m = new Date(START.getFullYear(), START.getMonth(), 1);
  var DOW = ["M","T","W","T","F","S","S"];
  while(m <= endD){
    html += '<div class="monthhead">' + MONTHS[m.getMonth()] + ' ' + m.getFullYear() + '</div>';
    html += '<div class="calgrid">';
    for(var h=0;h<7;h++) html += '<div class="caldow">' + DOW[h] + '</div>';
    var lead = (m.getDay()+6)%7;
    for(var b=0;b<lead;b++) html += '<div class="calcell blank"></div>';
    var dim = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
    for(var day=1;day<=dim;day++){
      var d = new Date(m.getFullYear(), m.getMonth(), day);
      var wn = weekNumber(d);
      if(wn < 1 || wn > DATA.meta.programWeeks){ html += '<div class="calcell blank">' + day + '</div>'; continue; }
      var k = dateKey(d);
      var mbase = layoutFor(wn)[DAYNAMES[d.getDay()]];
      var skey = OVR[k] || mbase;
      var movedCell = skey !== mbase;
      if(movedCell) anyMoved = true;
      var comp = completionOn(k);
      var isClass = comp && comp.session === "sculpt";
      var cls = "calcell " + (comp ? (isClass ? "cal-class" : "cal-done") :
        (isLift(skey) ? "cal-lift" : (skey === "rest" ? "cal-rest" : "cal-open"))) + (k === TKEY ? " cal-today" : "") +
        (movedCell && !comp ? " cal-moved" : "");
      html += '<button class="' + cls + '" data-day="' + k + '">' + day +
        (comp ? '<span class="calmark">' + (isClass ? "🔥" : "✓") + '</span>' : '') + '</button>';
    }
    html += '</div>';
    m = new Date(m.getFullYear(), m.getMonth()+1, 1);
  }
  html += '<div class="heatlegend" style="margin-top:6px">' +
    '<span><i style="background:var(--accent-soft);border:1.5px solid var(--accent)"></i>lifting day</span>' +
    '<span><i style="background:var(--flame-soft)"></i>class day</span>' +
    '<span><i style="background:var(--good)"></i>done</span>' +
    '<span><i style="background:var(--flame)"></i>class logged</span>' +
    (anyMoved ? '<span>↷ moved — a one-off change</span>' : '') + '</div>';
  return html;
}

function renderHistory(){
  var html = '<button class="backbtn" data-nav="plan">← Back to schedule</button>';
  html += '<div class="pagehead"><h1>History</h1><p>Everything you\u2019ve logged, newest first. Tap one to see it — or fix it if a day got logged wrong.</p></div>';
  if(!S.completions.length){
    html += '<div class="card emptystate"><div class="big">🕘</div><p>Nothing here yet — your history starts with workout one.</p></div>';
  } else {
    for(var i=S.completions.length-1;i>=0;i--){
      var c = S.completions[i];
      var isClass = c.session === "sculpt";
      var title = isClass ? "Sculpt class" : ((DATA.sessions[c.session]||{}).title || "Workout");
      var d = parseLocalDate(c.date);
      var meta = [];
      if(!isClass && c.dur) meta.push(c.dur + " min");
      if(!isClass && c.vol) meta.push(c.vol.toLocaleString() + " lb");
      if(isClass && c.effort) meta.push(c.effort);
      html += '<button class="dayrow ' + (isClass ? "isopen" : "islift") + '" data-day="' + c.date + '">' +
        '<span class="dnum">' + d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + '</span>' +
        '<span class="dsess">' + (isClass ? "🔥 " : "") + esc(title) + '</span>' +
        '<span class="dmark' + (isClass?" fl":"") + '">' + esc(meta.join(" · ")) + '</span></button>';
    }
  }
  html += footerBlock();
  return html;
}

function renderLetters(){
  var html = '<button class="backbtn" data-nav="progress">← Back</button>';
  html += '<div class="pagehead"><h1>' + esc((DATA.lettersMeta && DATA.lettersMeta.title) || "Letters") + '</h1>';
  if(DATA.lettersMeta && DATA.lettersMeta.intro) html += '<p>' + esc(DATA.lettersMeta.intro) + '</p>';
  html += '</div>';
  var all = writtenLetters();
  if(!all.length){
    html += '<div class="card emptystate"><div class="big">✉️</div><p>Nothing here yet.</p></div>';
    return html + footerBlock();
  }
  all.forEach(function(L){
    if(letterUnlocked(L)){
      html += '<div class="card lettercard">' + letterBlock(L) + '</div>';
    } else {
      // locked: the teaser only. The body must never reach the HTML — this page is public.
      html += '<div class="card lockedletter"><span class="lock">🔒</span> ' + esc(L.lockedTeaser || lockLabel(L.trigger)) + '</div>';
    }
  });
  return html + footerBlock();
}

/* ---------- DAY PREVIEW ---------- */
function renderDayPreview(dateStr){
  var d = parseLocalDate(dateStr);
  var wkRaw = weekNumber(d);
  var wk = clampWeek(wkRaw);
  var key = sessionKeyFor(d);
  var session = DATA.sessions[key];
  var dayTitle = d.toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric"});
  var isToday = dateStr === TKEY;
  var isPast = dateStr < TKEY;

  var html = '<button class="backbtn" data-nav="' + BACK_TO + '">← Back</button>';
  html += '<div class="pagehead"><div class="daylabel">' + esc(dayTitle) + (wkRaw >= 1 && wkRaw <= DATA.meta.programWeeks ? ' · Week ' + wkRaw : '') + '</div>';
  html += '<h1>' + esc(session.title) + '</h1></div>';

  var pbase = baseKeyFor(d);
  if(key !== pbase){
    var usual = pbase === "rest" ? "a rest day" : (pbase === "open" ? "a class day" : ((DATA.sessions[pbase]||{}).title || "different"));
    html += '<div class="previewbanner">↷ Moved for this week — this day is usually ' + esc(usual) + '.</div>';
  }

  if(isToday){
    html += '<div class="previewbanner">This is today — the <b>Today</b> tab is where you check things off.</div>';
  }

  if(isPast && wkRaw >= 1){
    var pcomp = completionOn(dateStr);
    if(pcomp){
      var pClass = pcomp.session === "sculpt";
      html += '<div class="card"><h3 class="ptitle">' + (pClass ? "Logged: Sculpt class 🔥" : "Logged: " + esc((DATA.sessions[pcomp.session]||{}).title || "workout") + " ✓") + '</h3>';
      if(!pClass){
        var pb = [];
        if(pcomp.dur) pb.push(pcomp.dur + " min");
        if(pcomp.vol) pb.push(pcomp.vol.toLocaleString() + " lb moved");
        if(pb.length) html += '<p class="ex-note">' + pb.join(" · ") + '</p>';
      }
      if(pClass){
        html += '<p class="ex-note" style="margin-top:4px">How was it?</p><div class="effortrow">';
        (DATA.sessions.open.efforts || []).forEach(function(ef){
          html += '<button class="effort' + (pcomp.effort === ef.id ? " on" : "") + '" data-effort-date="' + dateStr + '" data-effort-id="' + ef.id + '">' +
            '<span class="em">' + ef.emoji + '</span>' + esc(ef.label) + '</button>';
        });
        html += '</div>';
      }
      html += '<div class="ex-actions" style="margin-top:10px"><button class="mini" data-edit-remove="' + dateStr + '">Remove — logged by mistake</button></div>';
      html += '</div>';
    } else if(key !== "rest"){
      html += '<div class="card"><h3 class="ptitle">Did this day happen?</h3>' +
        '<p class="ex-note">If you worked out but never logged it, add it here — it counts exactly the same.</p>' +
        '<div class="ex-actions" style="margin-top:10px">';
      if(isLift(key)) html += '<button class="mini" data-backfill-lift="' + dateStr + '">＋ I did ' + esc(session.title) + '</button>';
      html += '<button class="mini" data-backfill-class="' + dateStr + '">＋ I went to Sculpt</button>';
      html += '</div></div>';
    }
  }

  if(isLift(key)){
    html += renderSessionPreviewCards(key, session, wk, isToday ? null :
      (isPast ? "What this day looked like on the plan:" : "Coming up — the weights shown are the ones you\u2019re on right now; they\u2019ll climb as you do."));
  } else if(key === "open"){
    html += '<div class="card restcard"><div class="big">🔥</div><p>' + esc(session.card) + '</p>' +
      (isPast ? '' : '<p class="ex-note" style="margin-top:8px">On the day, a one-tap button here logs your class.</p>') + '</div>';
  } else {
    html += '<div class="card restcard"><div class="big">🌙</div><p>' + esc(session.card) + '</p></div>';
  }
  return html;
}

/* ---------- GUIDE ---------- */
var GUIDE_TABS = [["all","All"],["plan","The plan"],["stronger","Stronger"],["classes","Classes"],["life","Life"],["coach","Your coach"]];
function renderProgram(){
  // a deep link (#program/<id>) shows everything so the target section is on the page
  var tab = ROUTE.section ? "all" : (S.prefs.guideTab || "all");
  function show(tg){ return tab === "all" || tab === tg; }
  var html = '<div class="pagehead"><h1>Your program</h1></div>';
  html += '<div class="gchips">';
  GUIDE_TABS.forEach(function(t){
    html += '<button class="gchip' + (tab === t[0] && !ROUTE.section ? " on" : "") + '" data-gtab="' + t[0] + '">' + t[1] + '</button>';
  });
  html += '</div><div class="guide">';
  if(tab === "all") (DATA.guide.intro || []).forEach(function(p){ html += '<p>' + esc(p) + '</p>'; });

  if(show("plan")){
    html += '<div class="card" id="sec-how"><h3>How this works</h3>';
    (DATA.copy.howItWorks || []).forEach(function(p){ html += '<p>' + esc(p) + '</p>'; });
    html += '<p>' + esc(DATA.progression.rule) + '</p></div>';
    html += '<div class="card" id="sec-workouts"><h3>The three gym workouts</h3>';
    ["liftA","liftB","liftC"].forEach(function(k){
      var s = DATA.sessions[k];
      html += '<p style="margin-top:10px"><b>' + esc(s.title) + '</b><br>' + esc(s.blurb || "") + '</p>';
      html += '<div class="exlist">' + esc(s.exercises.map(function(slot){ return DATA.exercises[slot.exerciseId].name; }).join(" · ")) + '</div>';
    });
    html += '</div>';
  }

  if(show("stronger")){
    html += '<div class="card" id="sec-blocks"><h3>The three blocks</h3>';
    DATA.blocks.forEach(function(b){
      html += '<div class="blockrow"><span class="bnum">Wk ' + b.weeks[0] + '–' + b.weeks[1] + ' · ' + esc(b.name) + '</span><span class="btext">' + esc(b.focus) + '</span></div>';
    });
    html += '</div>';
    if(STEADY && STEADY_CFG.guideBody){
      html += '<div class="card" id="sec-steady"><h3>' + esc(STEADY_CFG.headline) + '</h3>';
      STEADY_CFG.guideBody.forEach(function(p){ html += '<p>' + esc(p) + '</p>'; });
      html += '</div>';
    }
  }

  (DATA.guide.sections || []).forEach(function(sec){
    if(sec.tag && !show(sec.tag)) return;
    html += '<div class="card" id="sec-' + esc(sec.id || "") + '"><h3>' + esc(sec.title) + '</h3>';
    sec.body.forEach(function(p){ html += '<p>' + esc(p) + '</p>'; });
    html += '</div>';
  });

  var coach = DATA.guide.coach;
  if(coach && show("coach")){
    // Coverage goes up, visible surface goes down: one spotlight, collapsed groups whose
    // headers name what's inside, and the detail only when she asks for it.
    function coachRow(u){
      return '<div class="coachrow"><div class="crhead">' + (u.emoji ? esc(u.emoji) + ' ' : '') + '<b>' + esc(u.title) + '</b></div>' +
        '<p class="crwhen">' + esc(u.when) + '</p>' +
        '<button class="sayline" data-copy="' + esc(u.say) + '"><span class="saylbl">Say</span>\u201c' + esc(u.say) + '\u201d</button></div>';
    }
    html += '<div class="card coachcard" id="sec-coach"><h3>' + esc(coach.title) + '</h3>';
    (coach.intro || []).forEach(function(p){ html += '<p>' + esc(p) + '</p>'; });

    var earlyIds = (WEEK >= 1 && WEEK <= 2) ? (coach.firstWeeks || []) : [];
    var byId = {};
    (coach.groups || []).forEach(function(g){ (g.rows || []).forEach(function(r){ byId[r.id] = r; }); });
    if(coach.spotlight) byId.sunday = coach.spotlight;

    if(earlyIds.length){
      html += '<div class="spotlight"><div class="spothead">' + esc(coach.firstWeeksTitle || "Start with these") + '</div>';
      earlyIds.forEach(function(id){ if(byId[id]) html += coachRow(byId[id]); });
      html += '</div>';
    } else if(coach.spotlight){
      html += '<div class="spotlight">' + coachRow(coach.spotlight) + '</div>';
    }

    (coach.groups || []).forEach(function(g){
      var rows = (g.rows || []).filter(function(r){ return earlyIds.indexOf(r.id) < 0; });
      if(!rows.length) return;
      var op = (window.__open||{})["cg-"+g.id];
      html += '<details class="coachgroup" data-ho="cg-' + esc(g.id) + '"' + (op ? " open" : "") + '><summary>' +
        '<span class="cgtitle">' + esc(g.emoji) + ' ' + esc(g.title) + '</span>' +
        '<span class="cgpeek">' + esc(g.peek || "") + '</span></summary>';
      rows.forEach(function(r){ html += coachRow(r); });
      html += '</details>';
    });

    if(coach.bigger){
      var ob = (window.__open||{})["cg-bigger"];
      html += '<details class="coachgroup" data-ho="cg-bigger"' + (ob ? " open" : "") + '><summary>' +
        '<span class="cgtitle">🌙 The big ones — once in a while</span>' +
        '<span class="cgpeek">' + esc((coach.bigger.items || []).map(function(i){ return i.title.toLowerCase(); }).join(" · ")) + '</span></summary>' +
        '<p class="crwhen">' + esc(coach.bigger.note) + '</p>';
      (coach.bigger.items || []).forEach(function(u){ html += coachRow(u); });
      html += '</details>';
    }
    if(coach.utility){
      html += '<div class="utilrow">' + coachRow(coach.utility) + '</div>';
    }
    html += '</div>';
  }

  if(tab === "all"){
    var credits = {};
    Object.keys(DATA.exercises).forEach(function(id){
      var m = DATA.exercises[id].media;
      if(m && m.credit) credits[m.credit] = true;
    });
    var creditList = Object.keys(credits);
    if(creditList.length) html += '<p class="ex-note" style="text-align:center;opacity:.7;margin-top:14px">Exercise demos: ' + esc(creditList.join(" · ")) + '</p>';
  }
  html += '</div>' + footerBlock();
  return html;
}

/* ---------- milestones ---------- */
// Pure, id-stable, order-stable. Ids never change once shipped: they are the memory
// of what she's already been congratulated for.
function milestones(){
  var out = [];
  if(!S.completions.length) return out;
  var n = totalCount(), classes = classCount();
  out.push({ id: "first-workout", text: "First workout: " + niceDate(S.completions[0].date) });
  var firstClass = null;
  S.completions.forEach(function(c){ if(!firstClass && c.session === "sculpt") firstClass = c.date; });
  if(firstClass) out.push({ id: "first-class", text: "First class logged: " + niceDate(firstClass) });
  [5,10,15,20,25,30,40,50].forEach(function(t){ if(n >= t) out.push({ id: "workouts-"+t, text: t + " workouts" }); });
  [10,20,30].forEach(function(t){ if(classes >= t) out.push({ id: "classes-"+t, text: t + " Sculpt classes" }); });
  var hip = null;
  ["liftB","liftC"].forEach(function(k){ DATA.sessions[k].exercises.forEach(function(slot){ if(slot.exerciseId === "hip_thrust") hip = slot; }); });
  if(hip && currentWeight("hip_thrust", hip).indexOf("barbell") >= 0) out.push({ id: "barbell-hip-thrust", text: "Graduated to the barbell hip thrust" });
  var comebacks = 0, bestVol = 0;
  S.completions.forEach(function(c){ if(c.welcomeBack) comebacks++; if(c.vol && c.vol > bestVol) bestVol = c.vol; });
  if(comebacks > 0) out.push({ id: "comeback", text: "Came back after a break — the one most people never do" });
  if(bestVol > 0) out.push({ id: "best-volume", text: "Biggest single session: ~" + bestVol.toLocaleString() + " lb moved" });
  return out;
}
function newMilestones(){
  var seen = S.milesSeen || [];
  return milestones().filter(function(m){ return seen.indexOf(m.id) < 0; });
}
// Rev 8 upgrade: a device that already has history would "newly earn" a wall of stale
// stars. Anything already true on an existing device is history, not news.
if(!S.milesBackfilled){
  S.milesBackfilled = true;
  if(S.completions.length) S.milesSeen = milestones().map(function(m){ return m.id; });
  saveState();
}

/* ---------- letters ---------- */
function letterUnlocked(L){
  var t = L.trigger || {};
  if(t.type === "workouts") return totalCount() >= t.count;
  if(t.type === "lifts") return liftCount() >= t.count;
  if(t.type === "classes") return classCount() >= t.count;
  if(t.type === "comebacks"){
    var c = 0; S.completions.forEach(function(x){ if(x.welcomeBack) c++; });
    return c >= t.count;
  }
  if(t.type === "week") return WEEK >= t.week && totalCount() > 0;
  return false;
}
function dec(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return ""; } }
function writtenLetters(){
  // an unwritten slot simply does not exist — nothing blank ever reaches her
  return (DATA.letters || []).filter(function(L){ return L && L.t && L.b && L.b.length; });
}
function unlockedLetters(){ return writtenLetters().filter(letterUnlocked); }
function newLetters(){
  var seen = S.lettersSeen || [];
  return unlockedLetters().filter(function(L){ return seen.indexOf(L.id) < 0; });
}
function lockLabel(t){
  if(!t) return "Unlocks later";
  if(t.type === "workouts") return "Unlocks at workout " + t.count;
  if(t.type === "lifts") return "Unlocks at gym session " + t.count;
  if(t.type === "classes") return "Unlocks at Sculpt class " + t.count;
  if(t.type === "week") return "Unlocks in week " + t.week;
  if(t.type === "comebacks") return t.count === 1 ? "Unlocks the day you come back from a break" : "Unlocks after " + t.count + " comebacks";
  return "Unlocks later";
}
function letterBlock(L){
  var h = '<h3 class="ltitle">' + esc(dec(L.t)) + '</h3>';
  if(L.photo){
    h += '<img class="lphoto" src="./media/' + L.photo + '" alt="' + esc(L.photoAlt || "") + '" loading="lazy" decoding="async">';
    if(L.pc) h += '<div class="lcaption">' + esc(dec(L.pc)) + '</div>';
  }
  (L.b || []).forEach(function(p){ h += '<p>' + esc(dec(p)) + '</p>'; });
  if(L.sg) h += '<div class="lsign">' + esc(dec(L.sg)) + '</div>';
  return h;
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
  var n = totalCount();
  var html = '<div class="pagehead"><h1>Your progress</h1><p>Every number here is real, and none of them ever go down.</p></div>';

  if(n === 0){
    html += '<div class="card emptystate"><div class="big">🌱</div><p><b>Your first workout starts this page.</b><br>Workout count, weights climbing, your training month in color — it all begins the moment you finish workout one (or log your first class).</p></div>';
    html += footerBlock();
    return html;
  }

  var lifts = liftCount(), classes = classCount();
  var totalVol = 0, comebacks = 0, bestVol = 0;
  var durs = [];
  S.completions.forEach(function(c){
    if(c.vol){ totalVol += c.vol; if(c.vol > bestVol) bestVol = c.vol; }
    if(c.welcomeBack) comebacks++;
    if(typeof c.dur === "number" && c.dur > 0) durs.push(c.dur);
  });

  html += '<div class="tiles">';
  html += '<div class="tile hero"><div class="tnum" id="heronum" data-n="' + n + '">' + n + '</div><div class="tlabel">workouts — this number only goes up</div></div>';
  html += '<div class="tile"><div class="tnum">' + lifts + '</div><div class="tlabel">gym sessions</div></div>';
  html += '<div class="tile flame"><div class="tnum">' + classes + '</div><div class="tlabel">Sculpt classes</div></div>';
  html += '<div class="tile"><div class="tnum">' + (totalVol >= 1000 ? (Math.round(totalVol/100)/10).toLocaleString() + "k" : totalVol) + '</div><div class="tlabel">total pounds you\u2019ve lifted</div></div>';
  if(durs.length){
    var avgDur = Math.round(durs.reduce(function(a,b){ return a+b; }, 0) / durs.length);
    html += '<div class="tile"><div class="tnum">' + avgDur + '<span style="font-size:1rem;color:var(--sub)"> min</span></div><div class="tlabel">average gym session</div></div>';
  }
  if(comebacks > 0) html += '<div class="tile"><div class="tnum">' + comebacks + '</div><div class="tlabel">comeback' + (comebacks===1?"":"s") + ' — the hardest workout, done</div></div>';
  else if(WEEK >= 1) html += '<div class="tile"><div class="tnum">' + Math.min(WEEK, DATA.meta.programWeeks) + '<span style="font-size:1rem;color:var(--sub)">/' + DATA.meta.programWeeks + '</span></div><div class="tlabel">weeks in · ' + esc(blockFor(WEEKCLAMP).name) + '</div></div>';
  html += '</div>';

  // training month heat map
  html += '<div class="heatwrap"><h3>Your training months</h3><div class="heatgrid">';
  for(var w = 1; w <= DATA.meta.programWeeks; w++){
    for(var i=0;i<7;i++){
      var d = new Date(START); d.setDate(START.getDate() + (w-1)*7 + i);
      var k = dateKey(d);
      var comp = completionOn(k);
      var cls = "heatcell";
      if(comp && comp.session === "sculpt"){
        cls += comp.effort === "melted" ? " c3" : (comp.effort === "solid" ? " c2" : " c1");
      } else if(comp) cls += " lift";
      else if(parseLocalDate(k) > parseLocalDate(TKEY)) cls += " future";
      html += '<div class="' + cls + '" title="' + k + '"></div>';
    }
  }
  html += '</div><div class="heatlegend">' +
    '<span><i style="background:var(--good)"></i>gym</span>' +
    '<span><i style="background:var(--flame)"></i>Sculpt (darker = harder)</span>' +
    '<span><i style="background:var(--chip)"></i>off</span></div></div>';

  html += '<div class="chartwrap"><h3>Workouts by week</h3><canvas id="chartWeekly" height="150"></canvas><p class="ex-note" id="chartnote"></p></div>';

  var climbs = [];
  var seen = {};
  ["liftA","liftB","liftC"].forEach(function(k){
    DATA.sessions[k].exercises.forEach(function(slot){
      var id = slot.exerciseId;
      if(seen[id]) return; seen[id] = true;
      // high-water mark, not current rung: a "felt heavy" tap must never delete a climb she earned
      var st = startIndex(id, slot);
      var best = S.rungBest[id] !== undefined ? Math.max(S.rungBest[id], rungIndex(id, slot)) : rungIndex(id, slot);
      if(best > st){
        var ladder = DATA.exercises[id].ladder;
        climbs.push({ name: DATA.exercises[id].name, from: ladder[st], to: ladder[Math.min(best, ladder.length-1)], steps: best - st });
      }
    });
  });
  html += '<div class="card"><h3 class="ptitle">Weights that have climbed</h3>';
  if(climbs.length){
    climbs.sort(function(a,b){ return b.steps - a.steps; });
    climbs.forEach(function(c){
      html += '<div class="climbrow"><div class="cname">' + esc(c.name) + '</div>' +
        '<div class="cmove">' + esc(c.from) + ' → ' + esc(c.to) + '<span class="cup">' + c.steps + ' step' + (c.steps>1?"s":"") + ' up</span></div></div>';
    });
  } else {
    html += '<p class="ex-note">Nothing yet — exactly right for where you are. The first bump usually lands in week one or two.</p>';
  }
  html += '</div>';

  // The staircase: her ladders as pictures rather than numbers. Rungs she's climbed are
  // filled, the one she's on is labelled, the ones above are visibly waiting.
  html += '<div class="card"><h3 class="ptitle">How far up each ladder you are</h3>';
  var stairSeen = {};
  ["liftA","liftB","liftC"].forEach(function(k){
    DATA.sessions[k].exercises.forEach(function(slot){
      var id = slot.exerciseId;
      if(stairSeen[id]) return; stairSeen[id] = true;
      var ex = DATA.exercises[id], ladder = ex.ladder || [];
      if(ladder.length < 2) return;
      var st = startIndex(id, slot);
      var cur = rungIndex(id, slot);
      var best = S.rungBest[id] !== undefined ? Math.max(S.rungBest[id], cur) : cur;
      html += '<div class="stair"><div class="sname">' + esc(ex.name) + '</div><div class="srungs">';
      for(var r = 0; r < ladder.length; r++){
        var cls = r <= best ? (r <= st ? "sr filled base" : "sr filled") : "sr";
        if(r === best) cls += " now";
        html += '<span class="' + cls + '"></span>';
      }
      html += '</div><div class="slabel">' + esc(ladder[Math.min(best, ladder.length-1)]) +
        (best > st ? ' <span class="cup">' + (best - st) + ' up from ' + esc(ladder[st]) + '</span>' : '') + '</div></div>';
    });
  });
  html += '</div>';

  var letters = writtenLetters();
  if(letters.length){
    var unlocked = unlockedLetters();
    html += '<button class="dayrow islift" data-nav="letters"><span class="dnum">✉️</span>' +
      '<span class="dsess">' + (unlocked.length ? unlocked.length + ' letter' + (unlocked.length===1?'':'s') + ' waiting for you' : 'Letters — the first one unlocks soon') +
      '</span><span class="dmark">open →</span></button>';
  }

  html += '<div class="card"><h3 class="ptitle">Milestones</h3>';
  milestones().forEach(function(m){ html += '<div class="milerow"><span class="mdot">★</span><span>' + esc(m.text) + '</span></div>'; });
  html += '</div>';
  html += '<footer><p>No scales, no measurements, no photos — strength and showing up are the scoreboard here.</p></footer>';
  return html;
}

function drawCharts(){
  if(ROUTE.page !== "progress" || !window.Chart) return;
  var el = document.getElementById("chartWeekly");
  if(!el || !el.getContext) return;
  var weeks = [], liftsW = [], classesW = [];
  for(var w=1; w<=DATA.meta.programWeeks; w++){ weeks.push("W"+w); liftsW.push(0); classesW.push(0); }
  S.completions.forEach(function(c){
    if(c.date && c.date < DATA.meta.startDate) return;  // an earlier chapter's weeks would collide with this program's week numbers
    var w = c.week;
    if(!w || w < 1 || w > DATA.meta.programWeeks) return;
    if(c.session === "sculpt") classesW[w-1]++; else liftsW[w-1]++;
  });
  var css = getComputedStyle(document.documentElement);
  new Chart(el, {
    type: "bar",
    data: { labels: weeks, datasets: [
      { label: "Gym", data: liftsW, backgroundColor: css.getPropertyValue("--good").trim(), stack: "s", borderRadius: 4 },
      { label: "Sculpt", data: classesW, backgroundColor: css.getPropertyValue("--flame").trim(), stack: "s", borderRadius: 4 }
    ]},
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: css.getPropertyValue("--sub").trim(), boxWidth: 12 } } },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: css.getPropertyValue("--sub").trim(), font: { size: 9 } } },
        y: { stacked: true, beginAtZero: true, max: 7, ticks: { stepSize: 1, color: css.getPropertyValue("--sub").trim() }, grid: { color: css.getPropertyValue("--line").trim() } }
      }
    }
  });
  var note = document.getElementById("chartnote");
  if(note) note.textContent = "";
}

function footerBlock(){
  var html = '<footer><p>Made for Macy. Nobody else has this exact plan.</p>';
  html += '<p class="syncbadge" id="syncbadge">' + SYNC_STATUS + '</p>';
  if(DATA.meta.demoMode) html += '<span class="demotag">demo preview — not the real start date</span>';
  html += '<p style="margin-top:4px;opacity:.6">v.' + DATA.meta.buildTag + '</p></footer>';
  return html;
}

/* ---------- render + wiring ---------- */
function render(){
  var app = document.getElementById("app");
  var nextHash = ROUTE.page === "letters" ? "letters" :
    ROUTE.page === "day" ? "day/" + ROUTE.date :
    (ROUTE.page === "program" && ROUTE.section ? "program/" + ROUTE.section :
    (ROUTE.page === "today" ? "" : ROUTE.page));
  var sameRoute = nextHash === LAST_RENDERED_HASH;
  var sy = window.pageYOffset || 0;
  var html = '<div class="fadepage">';
  if(ROUTE.page === "plan") html += renderPlan();
  else if(ROUTE.page === "program") html += renderProgram();
  else if(ROUTE.page === "progress") html += renderProgress();
  else if(ROUTE.page === "day") html += renderDayPreview(ROUTE.date);
  else if(ROUTE.page === "history") html += renderHistory();
  else if(ROUTE.page === "letters") html += renderLetters();
  else html += renderToday();
  html += '</div>';
  app.innerHTML = html;
  LAST_RENDERED_HASH = nextHash;
  tabbar();
  appbarWeek();
  a2hsStrip();
  wire();
  afterRender(sameRoute, sy);
}

function afterRender(sameRoute, sy){
  if(JUST.finished && document.querySelector){
    // deliberate scroll: center the celebration
    var cel = document.getElementById("celebrate");
    if(cel && cel.scrollIntoView) cel.scrollIntoView({ block: "center", behavior: "smooth" });
    fireConfetti();
  } else if(!sameRoute){
    if(window.scrollTo) window.scrollTo(0, 0);
    if(ROUTE.page === "plan" && document.querySelector){
      var cur = document.querySelector(".weekcard[open]");
      if(cur && cur.scrollIntoView) cur.scrollIntoView({ block: "start" });
    }
    if(ROUTE.page === "program" && ROUTE.section && document.getElementById){
      var gsec = document.getElementById("sec-" + ROUTE.section);
      if(gsec && gsec.scrollIntoView) gsec.scrollIntoView({ block: "start" });
    }
  } else {
    // same-page re-render (set taps, timers, toggles): stay exactly where she was
    if(window.scrollTo) window.scrollTo(0, sy || 0);
  }
  manageElapsed();
  var fill = document.getElementById("pfill");
  if(fill && fill.style && PREV_PCT !== null && RENDER_PCT !== null && PREV_PCT !== RENDER_PCT){
    fill.style.width = PREV_PCT + "%";
    var raf = window.requestAnimationFrame || function(f){ setTimeout(f, 16); };
    raf(function(){ fill.style.width = RENDER_PCT + "%"; });
  }
  PREV_PCT = RENDER_PCT;
  if(ROUTE.page === "progress"){
    countUpHero();
    drawCharts();
  }
  celebrateUnlocks();
  JUST = { check: null, finished: false, classLogged: false };
}

// One burst for milestones and letters combined, at most once per distinct set, and
// never on top of the session-finish burst that already fired.
function celebrateUnlocks(){
  if(ROUTE.page !== "today" || PRESTART) return;
  var ids = newMilestones().map(function(m){ return "m:" + m.id; })
    .concat(newLetters().map(function(L){ return "l:" + L.id; }));
  if(!ids.length) return;
  var sig = ids.join(",");
  if(S.milesFiredFor === sig) return;
  S.milesFiredFor = sig;
  saveState();
  if(JUST.finished) return;
  fireConfetti();
}
function countUpHero(){
  var el = document.getElementById("heronum");
  if(!el || !el.getAttribute) return;
  var target = parseInt(el.getAttribute("data-n"), 10);
  if(!target || target < 2) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cur = 0, steps = Math.min(target, 24);
  var iv = setInterval(function(){
    cur++;
    el.textContent = Math.round(target * cur / steps);
    if(cur >= steps) clearInterval(iv);
  }, 32);
}
function fireConfetti(){
  if(!window.confetti) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  try{
    confetti({ particleCount: 90, spread: 70, origin: { y: 0.7 },
      colors: ["#c26d8d", "#3f9d6f", "#e08a5a", "#f7e8ee"] });
  }catch(e){}
}

function wire(){
  var key = sessionKeyFor(NOW);
  var session = DATA.sessions[key];
  var welcomeBack = isWelcomeBack(key);
  if(!window.__open) window.__open = {};

  document.querySelectorAll("[data-nav]").forEach(function(btn){
    btn.addEventListener("click", function(){ nav(btn.getAttribute("data-nav")); });
  });
  document.querySelectorAll("[data-day]").forEach(function(el){
    el.addEventListener("click", function(){
      BACK_TO = (ROUTE.page === "today") ? "today" : (ROUTE.page === "history" ? "history" : "plan");
      nav("day/" + el.getAttribute("data-day"));
    });
  });
  document.querySelectorAll("[data-ho]").forEach(function(el){
    el.addEventListener("toggle", function(){ window.__open[el.getAttribute("data-ho")] = el.open; });
  });
  document.querySelectorAll("[data-a2hs-dismiss]").forEach(function(btn){
    btn.addEventListener("click", function(){ S.seenA2HS = true; saveState(); a2hsStrip(); });
  });
  document.querySelectorAll("[data-short]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(!S.shortToday) S.shortToday = {};
      if(btn.getAttribute("data-short") === "on") S.shortToday[TKEY] = true;
      else delete S.shortToday[TKEY];
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-feel]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var v = btn.getAttribute("data-feel");
      if(!S.feel) S.feel = {};
      if(S.feel[TKEY] === v) delete S.feel[TKEY]; else S.feel[TKEY] = v;
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-dz]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var i = btn.getAttribute("data-dz");
      if(!S.dayZero) S.dayZero = {};
      if(S.dayZero[i]) delete S.dayZero[i]; else S.dayZero[i] = true;
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-intro-done]").forEach(function(btn){
    btn.addEventListener("click", function(){ S.seenIntro = true; saveState(); render(); });
  });
  document.querySelectorAll("[data-note-seen]").forEach(function(btn){
    btn.addEventListener("click", function(){ if(NOTE) S.noteSeenId = NOTE.id; saveState(); render(); });
  });
  document.querySelectorAll("[data-miles-seen]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(!S.milesSeen) S.milesSeen = [];
      newMilestones().forEach(function(m){ if(S.milesSeen.indexOf(m.id) < 0) S.milesSeen.push(m.id); });
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-letter-seen]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-letter-seen");
      if(!S.lettersSeen) S.lettersSeen = [];
      if(S.lettersSeen.indexOf(id) < 0) S.lettersSeen.push(id);
      saveState(); render();
    });
  });

  document.querySelectorAll(".check").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(TIMER && TIMER.done) stopTimer();               // next set dismisses the "Go" flash
      if(!S.workStart[TKEY]) S.workStart[TKEY] = Date.now();  // backstop: first set starts the clock
      var ck = btn.getAttribute("data-ck");
      var sets = parseInt(btn.getAttribute("data-sets"), 10) || 1;
      var cur = Math.min(S.setDone[ck]||0, sets);
      if(cur >= sets){ S.setDone[ck] = 0; }               // full circle tapped -> reset
      else {
        S.setDone[ck] = cur + 1;
        if(S.setDone[ck] >= sets) JUST.check = ck;
      }
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-easy]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-easy");
      if(S.easyTap[id]) delete S.easyTap[id];
      else { S.easyTap[id] = TKEY; S.holds[id] = false; delete S.heavyTap[id]; }
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-heavy]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-heavy");
      if(S.heavyTap[id]) delete S.heavyTap[id];
      else { S.heavyTap[id] = TKEY; delete S.easyTap[id]; }
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-start-workout]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(!S.workStart[TKEY]) S.workStart[TKEY] = Date.now();
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-mute]").forEach(function(btn){
    btn.addEventListener("click", function(){
      S.muteTimer = !S.muteTimer;
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-view]").forEach(function(btn){
    btn.addEventListener("click", function(){
      S.prefs.planView = btn.getAttribute("data-view");
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-copy]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var t = btn.getAttribute("data-copy");
      // iPhone + Mac means Universal Clipboard: she taps here and pastes into the chat
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){
          if(btn.classList) btn.classList.add("copied");
          setTimeout(function(){ if(btn.classList) btn.classList.remove("copied"); }, 1400);
        }).catch(function(){});
      }
    });
  });
  document.querySelectorAll("[data-gtab]").forEach(function(btn){
    btn.addEventListener("click", function(){
      S.prefs.guideTab = btn.getAttribute("data-gtab");
      saveState();
      if(ROUTE.section) nav("program"); else render();
    });
  });
  document.querySelectorAll("[data-hold]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-hold");
      S.rung[id] = Math.max(0, (S.rung[id]||0) - 1);   // undo of a bump; high-water mark stands
      S.holds[id] = true;
      if(S.bumpedToday) delete S.bumpedToday[TKEY+"|"+id];
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-timer]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var ck = btn.getAttribute("data-timer");
      var secs = parseInt(btn.getAttribute("data-secs"), 10) || 90;
      primeChime();
      if(TIMER && TIMER.ck === ck){ stopTimer(); render(); return; }  // running -> stop; done -> dismiss
      stopTimer();
      S.restShown = ((S.restShown || 0) + 1) % 997;   // advance the photo each rest, stably
      saveState();
      TIMER = { ck: ck, endAt: Date.now() + secs*1000 };
      TIMER_IV = setInterval(tickTimer, 500);
      acquireWake();
      render();
    });
  });
  document.querySelectorAll("[data-log-class]").forEach(function(btn){
    btn.addEventListener("click", function(){
      JUST.classLogged = true;
      S.completions.push({ date: TKEY, session: "sculpt", week: WEEKCLAMP, effort: null, at: new Date().toISOString() });
      sortCompletions();
      saveState();
      render();
      fireConfetti();
    });
  });
  document.querySelectorAll("[data-effort]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var comp = completionOn(TKEY);
      if(comp && comp.session === "sculpt"){
        comp.effort = comp.effort === btn.getAttribute("data-effort") ? null : btn.getAttribute("data-effort");
        saveState();
        render();
      }
    });
  });
  document.querySelectorAll("[data-undo-class]").forEach(function(btn){
    btn.addEventListener("click", function(){
      for(var i=S.completions.length-1;i>=0;i--){
        if(S.completions[i].date === TKEY && S.completions[i].session === "sculpt"){ S.completions.splice(i,1); break; }
      }
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-effort-date]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var dk = btn.getAttribute("data-effort-date");
      var c = completionOn(dk);
      if(c && c.session === "sculpt"){
        var id = btn.getAttribute("data-effort-id");
        c.effort = c.effort === id ? null : id;
        saveState();
        render();
      }
    });
  });
  document.querySelectorAll("[data-edit-remove]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var dk = btn.getAttribute("data-edit-remove");
      for(var i=S.completions.length-1;i>=0;i--){
        if(S.completions[i].date === dk){
          var c = S.completions.splice(i,1)[0];
          if(c.session !== "sculpt"){
            (DATA.sessions[c.session] || {exercises:[]}).exercises.forEach(function(slot){
              var id = slot.exerciseId;
              S.exDoneCount[id] = Math.max(0, (S.exDoneCount[id]||0) - 1);
              // keep bump bookkeeping honest so a removal can't trigger a phantom climb
              if(S.lastBumpAt && (S.lastBumpAt[id]||0) > (S.exDoneCount[id]||0)) S.lastBumpAt[id] = S.exDoneCount[id]||0;
            });
          }
          break;
        }
      }
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-backfill-lift]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var dk = btn.getAttribute("data-backfill-lift");
      if(completionOn(dk)) return;
      var d = parseLocalDate(dk);
      var skey = sessionKeyFor(d);
      if(!isLift(skey)) return;
      var wk2 = clampWeek(weekNumber(d));
      var sess = DATA.sessions[skey];
      S.completions.push({ date: dk, session: skey, week: wk2, welcomeBack: false,
        vol: estSessionVolume(sess, false, wk2), dur: null, at: new Date().toISOString(), backfilled: true });
      sess.exercises.forEach(function(slot){ S.exDoneCount[slot.exerciseId] = (S.exDoneCount[slot.exerciseId]||0) + 1; });
      sortCompletions();
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-backfill-class]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var dk = btn.getAttribute("data-backfill-class");
      if(completionOn(dk)) return;
      var d = parseLocalDate(dk);
      S.completions.push({ date: dk, session: "sculpt", week: clampWeek(weekNumber(d)), effort: null,
        at: new Date().toISOString(), backfilled: true });
      sortCompletions();
      saveState();
      render();
    });
  });
  document.querySelectorAll("[data-undo-finish]").forEach(function(btn){
    btn.addEventListener("click", function(){
      for(var i=S.completions.length-1;i>=0;i--){
        if(S.completions[i].date === TKEY && S.completions[i].session !== "sculpt"){
          var c = S.completions.splice(i,1)[0];
          (DATA.sessions[c.session] || {exercises:[]}).exercises.forEach(function(slot){
            var id = slot.exerciseId;
            S.exDoneCount[id] = Math.max(0, (S.exDoneCount[id]||0) - 1);
          });
          break;
        }
      }
      saveState();
      render();
    });
  });
  var finish = document.getElementById("finish");
  if(finish){
    finish.addEventListener("click", function(){
      if(finish.disabled) return;
      JUST.finished = true;
      stopTimer();
      var st = S.workStart[TKEY];
      var dur = st ? Math.round((Date.now() - st) / 60000) : null;
      if(dur !== null && (dur < 1 || dur > 240)) dur = null;   // sanity: sub-minute or >4h means the clock lied
      var sv2 = session.shortVersion, wasShort = !!(sv2 && shortOnToday());
      var counted = wasShort ? sv2.keep.map(function(ix){ return session.exercises[ix]; }) : session.exercises;
      var volSession = wasShort ? { exercises: counted } : session;
      S.completions.push({ date: TKEY, session: key, week: WEEKCLAMP, welcomeBack: welcomeBack,
        vol: estSessionVolume(volSession, welcomeBack, WEEKCLAMP), dur: dur,
        short: wasShort || undefined,   // visible to her coach, never rendered as a lesser thing on her page
        at: new Date().toISOString() });
      counted.forEach(function(slot){
        S.exDoneCount[slot.exerciseId] = (S.exDoneCount[slot.exerciseId] || 0) + 1;
        S.holds[slot.exerciseId] = false;
      });
      sortCompletions();
      saveState();
      flushState();   // she's about to pocket the phone — don't let the idle timer lose this
      render();
    });
  }
}
function stopTimer(){
  if(TIMER_IV){ clearInterval(TIMER_IV); TIMER_IV = null; }
  TIMER = null;
  releaseWake();
  stopTitleFlash();
}
function tickTimer(){
  if(!TIMER || TIMER.done){ if(TIMER_IV){ clearInterval(TIMER_IV); TIMER_IV = null; } return; }
  var left = Math.ceil((TIMER.endAt - Date.now())/1000);
  if(left <= 0){
    // hold the "done" phase as state so the flashing chip survives re-renders
    clearInterval(TIMER_IV); TIMER_IV = null;
    TIMER = { ck: TIMER.ck, done: true };
    timerDoneAlert();
    releaseWake();
    render();
    return;
  }
  var btn = document.querySelector('[data-timer="'+TIMER.ck+'"]');
  if(btn && btn.textContent !== undefined) btn.textContent = "⏱ " + fmtSecs(left);
}
function primeChime(){
  // iOS unlocks media playback only inside a user gesture; prime silently on timer start
  if(CHIME_PRIMED) return;
  CHIME_PRIMED = true;
  var a = document.getElementById("chime");
  if(a && a.play){
    a.volume = 0;
    var p = a.play();
    if(p && p.then) p.then(function(){ a.pause(); try{ a.currentTime = 0; }catch(e){} a.volume = 1; }).catch(function(){ a.volume = 1; });
  }
}
function timerDoneAlert(){
  if(!S.muteTimer){
    var a = document.getElementById("chime");
    if(a && a.play){
      try{ a.currentTime = 0; }catch(e){}
      var p = a.play();
      if(p && p.catch) p.catch(function(){});
    }
  }
  if(document.hidden && !TITLE_IV){
    var on = false;
    TITLE_IV = setInterval(function(){ on = !on; document.title = on ? "💪 Rest done!" : BASE_TITLE; }, 1000);
  }
}
function stopTitleFlash(){
  if(TITLE_IV){ clearInterval(TITLE_IV); TITLE_IV = null; }
  if(document.title !== BASE_TITLE) document.title = BASE_TITLE;
}
function acquireWake(){
  // keep the screen on while a rest timer runs (guarded: Safari 16.4+)
  if(navigator.wakeLock && navigator.wakeLock.request){
    navigator.wakeLock.request("screen").then(function(w){ WAKE = w; }).catch(function(){});
  }
}
function releaseWake(){
  if(WAKE && WAKE.release){ try{ WAKE.release(); }catch(e){} }
  WAKE = null;
}
function manageElapsed(){
  if(ELAPSED_IV){ clearInterval(ELAPSED_IV); ELAPSED_IV = null; }
  if(!document.getElementById("elapsed")) return;
  tickElapsed();
  ELAPSED_IV = setInterval(tickElapsed, 1000);
}
function tickElapsed(){
  var el = document.getElementById("elapsed");
  var st = S.workStart[TKEY];
  if(!el || el.textContent === undefined || !st) return;
  el.textContent = "⏱ " + fmtSecs(Math.max(0, Math.floor((Date.now() - st)/1000)));
}

/* ---------- boot ---------- */
render();
bootSync();   // owns the first push: it must not race the restore read
if(document.addEventListener) document.addEventListener("touchstart", function(){}, {passive: true});
if(document.addEventListener) document.addEventListener("visibilitychange", function(){
  if(!document.hidden){
    stopTitleFlash();
    if(TIMER && !TIMER.done) acquireWake();  // iOS releases wake locks on hide; re-arm on return
  }
});
// retire any previously-installed service worker (the app is online-first now)
if("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations){
  navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
}
</script>
