<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;700;800&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<title>Macy's Coach</title>
<style>
:root{
  --bg:#faf8f5; --card:#ffffff; --ink:#2b2733; --sub:#635d6e; --line:#eee9e2; --line-strong:#ddd5cb;
  --accent:#c26d8d; --accent-ink:#a4506f; --accent-soft:#f7e8ee;
  --good:#3f9d6f; --good-ink:#2e7a55; --good-soft:#e7f4ec;
  --flame:#e08a5a; --flame-soft:#fbeadd;
  --chip:#f1edf3;
  --shadow:0 1px 2px rgba(43,39,51,.06), 0 6px 16px -6px rgba(43,39,51,.10);
  --display:"Fraunces",Georgia,serif;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17141c; --card:#221e29; --ink:#f0ecf4; --sub:#9d95a8; --line:#322c3b; --line-strong:#42394f;
    --accent:#d98aa8; --accent-ink:#e3a4bc; --accent-soft:#3a2530;
    --good:#5cb98a; --good-ink:#7ccf9f; --good-soft:#20342a;
    --flame:#e89a6e; --flame-soft:#3d2b20;
    --chip:#2c2735; --shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button{font-family:var(--ui)}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.45;
  padding:0 14px calc(92px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
body.inbrowser{padding-bottom:calc(148px + env(safe-area-inset-bottom))}

.appbar{position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;
  margin:0 -14px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.wordmark{font-size:.8rem;font-weight:800;letter-spacing:.09em;color:var(--accent-ink)}
.appbar .wk{font-size:.75rem;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}

header{padding:14px 2px 6px}
.daylabel{font-size:.82rem;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
h1,.pagehead h1{font-family:var(--display);font-size:1.65rem;line-height:1.15;margin-top:3px;font-weight:800;letter-spacing:-.01em}
.meta-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:.8rem;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.chip.count{background:var(--accent-soft);color:var(--accent-ink)}

.weekstrip{display:flex;gap:6px;margin:14px 0 4px}
.weekstrip .d{flex:1;text-align:center;font-size:.7rem;color:var(--sub);padding:4px 0;min-height:46px}
.weekstrip .dot{width:28px;height:28px;border-radius:50%;margin:4px auto 0;display:flex;align-items:center;justify-content:center;
  background:var(--chip);font-size:.74rem;color:var(--sub)}
.weekstrip .dot.today{outline:2px solid var(--accent);outline-offset:1px}
.weekstrip .dot.done{background:var(--good);color:#fff;font-weight:700}
.weekstrip .dot.classdone{background:var(--flame);color:#fff;font-weight:700}
.weekstrip .dot.lift{border:2px solid var(--accent);background:var(--accent-soft)}
.weekstrip .dot.openday{background:var(--flame-soft)}
.liftline{font-size:.78rem;color:var(--sub);margin:2px 0 4px;text-align:center}
.liftline b{color:var(--accent-ink);font-weight:700}

.banner{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin:12px 0;color:var(--ink)}
.banner h2{font-size:1.02rem;margin-bottom:4px;color:var(--accent-ink)}
.banner p{font-size:.9rem;margin-bottom:6px}
.banner p:last-child{margin-bottom:0}
.coachnote{background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.coachnote .from{font-size:.74rem;font-weight:800;letter-spacing:.07em;color:var(--accent-ink);text-transform:uppercase;margin-bottom:6px}
.coachnote p{font-size:.95rem}

.card{background:var(--card);border:1px solid var(--line-strong);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card.checked{opacity:.78}
.card.checked .ex-actions,.card.checked details,.card.checked .ex-note,.card.checked .ex-bump{display:none}
.ex-top{display:flex;align-items:flex-start;gap:12px}
.check{width:46px;height:46px;min-width:46px;border-radius:50%;border:2.5px solid var(--accent);opacity:.9;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:var(--accent-ink);margin-top:2px;
  transition:transform .15s ease-out;font-variant-numeric:tabular-nums}
.check:active{transform:scale(.88)}
.check.partial{border-color:transparent}
.card.checked .check{background:var(--good);border-color:var(--good);color:#fff;font-size:1.2rem;opacity:1}
.card.checked.just .check{animation:popIn .2s ease-out}
.card.checked.just{animation:fadeDim .2s ease-out}
@keyframes popIn{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fadeDim{from{opacity:1}to{opacity:.78}}
.ex-name{font-weight:700;font-size:1.02rem}
.ex-rx{color:var(--accent-ink);font-weight:700;font-size:.94rem;margin-top:1px;font-variant-numeric:tabular-nums}
.ex-weight{font-size:.94rem;color:var(--ink);margin-top:2px;font-weight:600}
.ex-note{font-size:.82rem;color:var(--sub);margin-top:4px}
.ex-bump{background:var(--good-soft);color:var(--good-ink);border-radius:10px;padding:8px 10px;font-size:.85rem;margin-top:8px;font-weight:600}
.ex-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{border:none;background:var(--chip);color:var(--sub);border-radius:999px;padding:10px 15px;font-size:.82rem;font-weight:600;
  transition:transform .12s ease-out,opacity .15s ease-out;font-variant-numeric:tabular-nums}
.mini:active{transform:scale(.95);opacity:.75}
.mini.active{background:var(--good-soft);color:var(--good-ink)}
.mini.timer.running{background:var(--accent-soft);color:var(--accent-ink)}
.mini.timer.done{background:var(--good);color:#fff;font-weight:800;animation:timerPulse 1s ease-in-out infinite}
@keyframes timerPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(63,157,111,.45)}50%{transform:scale(1.06);box-shadow:0 0 0 7px rgba(63,157,111,0)}}
button.chip{border:none;transition:transform .12s ease-out}
button.chip:active{transform:scale(.94)}
.chip.elapsedchip{background:var(--accent-soft);color:var(--accent-ink)}

details{margin-top:10px}
summary{font-size:.84rem;color:var(--sub);font-weight:600;cursor:pointer;list-style:none;-webkit-user-select:none;padding:9px 2px;
  transition:opacity .12s ease-out}
summary:active{opacity:.55}
summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
.howto{font-size:.88rem;color:var(--ink);padding:8px 2px 2px}
.howto p{margin-bottom:6px}
.howto .lbl{font-weight:700;color:var(--sub);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
.howto ul{padding-left:18px;margin:4px 0 8px}
.demo{position:relative;margin:2px 0 4px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.demo .pose{width:100%;display:block}
.demo .pose.b{position:absolute;left:0;top:0;opacity:0;animation:crossfade 2.4s ease-in-out infinite alternate}
@keyframes crossfade{0%,22%{opacity:0}78%,100%{opacity:1}}
.mediacredit{font-size:.66rem;color:var(--sub);opacity:.7;margin-bottom:8px}
.warm{font-size:.87rem;color:var(--sub);background:var(--chip);border-radius:12px;padding:10px 12px;margin:12px 0}

.donebtn{width:100%;border:none;border-radius:16px;padding:17px;font-size:1.05rem;font-weight:800;margin-top:14px;
  background:var(--accent);color:#fff;transition:transform .12s ease-out,opacity .15s ease-out}
.donebtn:active{transform:scale(.98)}
.donebtn:disabled{opacity:.45}
.classbtn{width:100%;border:none;border-radius:16px;padding:20px;font-size:1.1rem;font-weight:800;margin-top:14px;
  background:var(--flame);color:#fff;transition:transform .12s ease-out}
.classbtn:active{transform:scale(.97)}
.effortrow{display:flex;gap:10px;margin-top:12px;justify-content:center}
.effort{flex:1;max-width:110px;border:2px solid var(--line-strong);background:var(--card);border-radius:14px;padding:10px 6px;
  font-size:.85rem;font-weight:700;color:var(--sub);text-align:center;transition:transform .12s ease-out}
.effort:active{transform:scale(.94)}
.effort .em{display:block;font-size:1.5rem;margin-bottom:2px}
.effort.on{border-color:var(--flame);background:var(--flame-soft);color:var(--ink)}

.celebrate{background:var(--good-soft);border-radius:16px;padding:22px 18px;margin-top:14px;text-align:center}
.celebrate.classy{background:var(--flame-soft)}
.celebrate.just{animation:riseIn .25s ease-out}
@keyframes riseIn{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.celebrate .bignum{font-family:var(--display);font-size:3.4rem;font-weight:800;color:var(--good-ink);line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.celebrate.classy .bignum{color:var(--flame)}
.celebrate .biglabel{font-size:.82rem;color:var(--sub);margin:2px 0 10px}
.celebrate h2{color:var(--good-ink);font-size:1.05rem;margin-bottom:4px}
.celebrate.classy h2{color:var(--flame)}
.celebrate p{font-size:.9rem;color:var(--ink)}

.progressbar{height:6px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:12px}
.progressfill{height:100%;border-radius:999px;background:var(--accent);width:0;transition:width .25s ease-out}
.progresslabel{font-size:.78rem;color:var(--sub);margin-top:4px;text-align:right;font-variant-numeric:tabular-nums}
.restcard{padding:24px 18px;text-align:center}
.restcard .big{font-size:2.4rem;margin-bottom:8px}
footer{margin-top:22px;text-align:center}
footer p{font-size:.76rem;color:var(--sub)}
.syncbadge{font-size:.72rem;color:var(--sub);margin-top:4px}
.demotag{display:inline-block;background:var(--flame-soft);color:var(--flame);font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 10px;margin-top:6px}
.uncheck-hint{font-size:.74rem;color:var(--sub);text-align:center;margin-top:8px}
@keyframes dotPop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.weekstrip .dot.done.just,.weekstrip .dot.classdone.just{animation:dotPop .25s ease-out}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line-strong);padding:4px 8px calc(8px + env(safe-area-inset-bottom))}
body.inbrowser .tabbar{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.tabbar .inner{display:flex;width:100%;max-width:520px;margin:0 auto}
.tabbtn{flex:1;position:relative;border:none;background:transparent;color:var(--sub);font-size:.7rem;font-weight:700;padding:8px 0 5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;transition:transform .12s ease-out;min-height:52px}
.tabbtn:active{transform:scale(.94)}
.tabbtn svg{width:22px;height:22px}
.tabbtn.on{color:var(--accent-ink)}
.tabbtn.on::before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.a2hs{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:11;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:12px 14px;font-size:.84rem;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.a2hs button{border:none;background:transparent;color:var(--bg);font-weight:800;font-size:.84rem;padding:6px}

.pagehead{padding:14px 2px 4px}
.pagehead p{font-size:.88rem;color:var(--sub);margin-top:5px}
.fadepage{animation:pageIn .18s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.backbtn{border:none;background:var(--chip);color:var(--sub);border-radius:999px;padding:12px 18px;font-size:.85rem;font-weight:700;
  margin:12px 0 2px;transition:transform .12s ease-out}
.backbtn:active{transform:scale(.96)}
.previewbanner{background:var(--chip);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.85rem;color:var(--sub)}

.weekcard{background:var(--card);border:1px solid var(--line-strong);border-radius:16px;margin:10px 0;box-shadow:var(--shadow);padding:0}
.weekcard summary{padding:14px 16px;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--ink)}
.weekcard summary::before{content:none}
.weekcard summary .wnum{font-weight:800;color:var(--accent-ink);white-space:nowrap}
.weekcard summary .wblock{color:var(--sub);font-size:.78rem;flex:1}
.weekcard summary .minidots{display:flex;gap:4px}
.weekcard summary .md{width:10px;height:10px;border-radius:50%;background:var(--chip)}
.weekcard summary .md.l{background:var(--accent)}
.weekcard summary .md.dn{background:var(--good)}
.weekcard summary .md.cl{background:var(--flame)}
.weekcard summary .md.o{background:var(--flame-soft)}
.weekcard .wc-body{padding:2px 12px 12px}
.monthhead{font-family:var(--display);font-size:1.1rem;font-weight:800;margin:20px 2px 4px}
.dayrow{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:13px 12px;margin:5px 0;width:100%;text-align:left;font-size:.9rem;color:var(--ink);transition:transform .12s ease-out}
.dayrow:active{transform:scale(.985)}
.dayrow .dnum{min-width:48px;font-weight:700;color:var(--sub);font-size:.78rem;font-variant-numeric:tabular-nums}
.dayrow .dsess{flex:1;font-weight:600}
.dayrow.isrest .dsess{color:var(--sub);font-weight:500}
.dayrow.isopen{border-left:3px solid var(--flame)}
.dayrow.isopen .dsess{color:var(--flame);font-weight:600}
.dayrow.islift .dsess{color:var(--accent-ink)}
.dayrow .dmark{font-size:.8rem;color:var(--good-ink);font-weight:700}
.dayrow .dmark.fl{color:var(--flame)}
.dayrow.istoday{outline:2px solid var(--accent);outline-offset:1px}

.planbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px}
.viewtoggle{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.vbtn{border:none;background:transparent;color:var(--sub);border-radius:999px;padding:9px 16px;font-size:.82rem;font-weight:700;transition:transform .12s ease-out}
.vbtn.on{background:var(--card);color:var(--accent-ink);box-shadow:var(--shadow)}
.vbtn:active{transform:scale(.95)}
.histbtn{border:none;background:var(--chip);color:var(--sub);border-radius:999px;padding:10px 15px;font-size:.82rem;font-weight:700;transition:transform .12s ease-out}
.histbtn:active{transform:scale(.95)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0 6px}
.caldow{text-align:center;font-size:.66rem;color:var(--sub);font-weight:700;padding:2px 0}
.calcell{position:relative;aspect-ratio:1;border:none;border-radius:10px;background:var(--chip);color:var(--ink);
  font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:transform .12s ease-out}
.calcell:active{transform:scale(.92)}
.calcell.blank{background:transparent;color:var(--sub);opacity:.3;pointer-events:none}
.calcell.cal-rest{background:transparent;border:1px dashed var(--line);color:var(--sub)}
.calcell.cal-open{background:var(--flame-soft)}
.calcell.cal-lift{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent-ink)}
.calcell.cal-done{background:var(--good);color:#fff}
.calcell.cal-class{background:var(--flame);color:#fff}
.calcell.cal-today{outline:2px solid var(--accent);outline-offset:1px}
.calmark{font-size:.58rem;line-height:1}
.summarystrip{background:var(--card);border:1px solid var(--line-strong);border-radius:16px;margin:12px 0;box-shadow:var(--shadow)}
.summarystrip > summary{padding:14px 16px;font-size:.9rem;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.summarystrip .card{margin:6px 10px;box-shadow:none}

.headerphoto{margin:2px 0 10px;border-radius:14px;overflow:hidden;line-height:0}
.headerphoto .hp{width:100%;height:86px;object-fit:cover;display:block}
.celebphoto{margin:-6px 0 12px;border-radius:14px;overflow:hidden;line-height:0}
.celebphoto .cp{width:100%;display:block}
.restphoto{position:relative;margin:10px 0 2px;border-radius:14px;overflow:hidden;line-height:0;animation:riseIn .25s ease-out}
.restphoto .rp{width:100%;display:block}
.restphoto .restcap{position:absolute;left:0;right:0;bottom:0;padding:16px 12px 9px;color:#fff;font-weight:800;font-size:.9rem;
  background:linear-gradient(transparent, rgba(0,0,0,.55));line-height:1.2}
.milecard{background:var(--good-soft);border-radius:16px;padding:14px 16px;margin:12px 0}
.milecard .mhead{font-family:var(--display);font-size:1.02rem;font-weight:800;color:var(--good-ink);margin-bottom:4px}
.lettercard{border:1.5px solid var(--accent)}
.lettercard .from{font-size:.74rem;font-weight:800;letter-spacing:.07em;color:var(--accent-ink);text-transform:uppercase;margin-bottom:8px}
.lettercard .ltitle{font-family:var(--display);font-size:1.15rem;font-weight:800;margin-bottom:10px;color:var(--ink)}
.lettercard p{font-size:.94rem;margin-bottom:9px;line-height:1.55}
.lphoto{width:100%;border-radius:12px;display:block;margin:0 0 6px}
.lcaption{font-size:.76rem;color:var(--sub);margin-bottom:10px;text-align:center}
.lsign{font-family:var(--display);font-size:1rem;color:var(--accent-ink);text-align:right;margin-top:10px}
.lockedletter{color:var(--sub);font-size:.88rem;text-align:center;background:var(--bg);border-style:dashed}
.lockedletter .lock{opacity:.7}
.stair{padding:10px 0;border-bottom:1px solid var(--line)}
.stair:last-child{border-bottom:none}
.stair .sname{font-weight:700;font-size:.9rem}
.srungs{display:flex;gap:3px;margin:6px 0 4px;align-items:flex-end}
.srungs .sr{flex:1;height:16px;border-radius:3px;border:1px solid var(--line-strong);background:transparent}
.srungs .sr.filled{background:var(--accent);border-color:var(--accent)}
.srungs .sr.filled.base{background:var(--accent-soft);border-color:var(--accent-soft)}
.srungs .sr.now{height:24px;box-shadow:0 0 0 2px var(--accent-soft)}
.stair .slabel{font-size:.82rem;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dailyline{font-size:.92rem;color:var(--ink);background:var(--accent-soft);border-radius:12px;padding:10px 13px;margin:12px 0 2px;font-weight:600}
.startedat{opacity:.75}
.teaser{font-weight:600;color:var(--sub);font-size:.82rem}
.shortoffer{margin-top:14px}
.shortoffer > summary{text-align:center;color:var(--sub);opacity:.85}
.banner.short{background:var(--chip)}
.banner.short h2{color:var(--ink)}
.banner.steady{background:var(--chip)}
.banner.steady h2{color:var(--ink)}
.chip.steadychip{background:var(--chip);color:var(--sub)}
.dayzero .dzrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:12px;margin:6px 0;font-size:.88rem;color:var(--ink);transition:transform .12s ease-out}
.dayzero .dzrow:active{transform:scale(.985)}
.dayzero .dzbox{width:26px;height:26px;min-width:26px;border-radius:8px;border:2px solid var(--accent);background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:var(--accent-ink)}
.dayzero .dzrow.on .dzbox{background:var(--good);border-color:var(--good);color:#fff}
.dayzero .dzrow.on .dztext{color:var(--sub);text-decoration:line-through}
.dayzero.alldone{background:var(--good-soft);border-color:var(--good)}
.findit{background:var(--chip);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.gchips{position:sticky;top:calc(42px + env(safe-area-inset-top));z-index:8;display:flex;gap:6px;overflow-x:auto;
  margin:0 -14px;padding:8px 14px;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gchip{border:none;background:var(--chip);color:var(--sub);border-radius:999px;padding:9px 15px;font-size:.82rem;font-weight:700;
  white-space:nowrap;transition:transform .12s ease-out}
.gchip:active{transform:scale(.95)}
.gchip.on{background:var(--accent);color:#fff}
.coachcard .crhead{font-size:.95rem;margin-top:14px}
.coachcard .crwhen{font-size:.85rem;color:var(--sub);margin:2px 0 6px}
.sayline{display:block;width:100%;text-align:left;border:none;border-left:3px solid var(--accent);background:var(--chip);color:var(--ink);
  border-radius:10px;padding:9px 12px;font-size:.88rem;margin:0 0 4px;transition:transform .12s ease-out,background .2s}
.sayline:active{transform:scale(.985)}
.sayline.copied{background:var(--good-soft);border-left-color:var(--good)}
.sayline.copied .saylbl::after{content:" — copied"}
.sayline .saylbl{font-size:.68rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink);margin-right:8px}
.biggerblock{margin-top:18px;border-top:1px solid var(--line);padding-top:2px}
.spotlight{background:var(--accent-soft);border-radius:14px;padding:4px 12px 10px;margin:12px 0}
.spotlight .spothead{font-family:var(--display);font-size:.98rem;font-weight:800;color:var(--accent-ink);padding:10px 0 2px}
.spotlight .sayline{background:var(--card)}
.coachgroup{margin:8px 0;border-top:1px solid var(--line)}
.coachgroup > summary{padding:13px 2px;display:flex;flex-direction:column;gap:2px}
.coachgroup > summary::before{position:relative;top:0}
.coachgroup .cgtitle{font-weight:700;color:var(--ink);font-size:.92rem}
.coachgroup .cgpeek{font-size:.78rem;color:var(--sub);padding-left:14px}
.coachgroup[open] .cgpeek{display:none}
.utilrow{margin-top:14px;border-top:1px solid var(--line);padding-top:6px;opacity:.85}
.calcell.cal-moved::after{content:"↷";position:absolute;top:1px;right:4px;font-size:.55rem;line-height:1;opacity:.85}
.guide p{font-size:.92rem;margin-bottom:10px}
.guide .card h3{font-family:var(--display);font-size:1.08rem;margin-bottom:8px;color:var(--accent-ink)}
.guide .exlist{font-size:.84rem;color:var(--sub);margin-top:8px;line-height:1.6}
.blockrow{display:flex;gap:10px;align-items:baseline;margin:8px 0}
.blockrow .bnum{font-size:.72rem;color:var(--accent-ink);font-weight:800;text-transform:uppercase;letter-spacing:.06em;min-width:96px}
.blockrow .btext{font-size:.88rem}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line-strong);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tile .tnum{font-family:var(--display);font-size:1.9rem;font-weight:800;color:var(--accent-ink);line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile.hero{grid-column:1 / -1;text-align:center;padding:22px}
.tile.hero .tnum{font-size:3.2rem;color:var(--good-ink)}
.tile .tlabel{font-size:.76rem;color:var(--sub);font-weight:600;margin-top:3px}
.tile.flame .tnum{color:var(--flame)}
.chartwrap{background:var(--card);border:1px solid var(--line-strong);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.chartwrap h3,.heatwrap h3,.card h3.ptitle{font-family:var(--display);font-size:1.05rem;color:var(--accent-ink);margin-bottom:10px}
.heatwrap{background:var(--card);border:1px solid var(--line-strong);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.heatgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heatcell{aspect-ratio:1;border-radius:5px;background:var(--chip)}
.heatcell.lift{background:var(--good)}
.heatcell.c1{background:color-mix(in srgb, var(--flame) 45%, var(--chip))}
.heatcell.c2{background:color-mix(in srgb, var(--flame) 72%, var(--chip))}
.heatcell.c3{background:var(--flame)}
.heatcell.future{background:transparent;border:1px dashed var(--line)}
.heatcell.rest{background:transparent}
.heatlegend{display:flex;gap:12px;margin-top:10px;font-size:.72rem;color:var(--sub);flex-wrap:wrap}
.heatlegend span{display:flex;align-items:center;gap:5px}
.heatlegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.climbrow{padding:10px 0;border-bottom:1px solid var(--line)}
.climbrow:last-child{border-bottom:none}
.climbrow .cname{font-weight:700;font-size:.92rem}
.climbrow .cmove{color:var(--good-ink);font-size:.9rem;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.climbrow .cup{color:var(--sub);font-size:.78rem;margin-left:8px}
.milerow{display:flex;gap:10px;padding:9px 0;font-size:.88rem;align-items:baseline}
.milerow .mdot{color:var(--good-ink);font-weight:800}
.emptystate{text-align:center;padding:26px 16px;color:var(--sub);font-size:.9rem}
.emptystate .big{font-size:2rem;margin-bottom:8px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

,"shortVersion":{"keep":[0,1,2],"sets":2},"exercises":[{"exerciseId":"leg_press","sets":3,"week1Sets":2,"work":{"type":"reps","count":12},"block3Count":10,"ladderStart":"110 lb","amrapCalibration":true,"restSeconds":120},{"exerciseId":"hip_thrust","sets":3,"week1Sets":2,"work":{"type":"reps","count":10},"block3Count":8,"ladderStart":"25 lb dumbbell","restSeconds":120},{"exerciseId":"chest_supported_db_row","sets":3,"week1Sets":2,"work":{"type":"reps","count":10},"ladderStart":"15 lb dumbbells","restSeconds":90},{"exerciseId":"incline_db_press","sets":2,"week1Sets":2,"work":{"type":"reps","count":8},"ladderStart":"12 lb dumbbells","note":"If there are no 12s, grab the 10s.","restSeconds":90},{"exerciseId":"hip_abduction_machine","sets":2,"week1Sets":2,"work":{"type":"reps","count":12},"ladderStart":"50 lb on the stack","restSeconds":60}],"optionalFinisher":{"exerciseId":"back_extension_45","weeks":[9,12],"sets":2,"work":{"type":"reps","count":12},"ladderStart":"just your bodyweight","restSeconds":60}},"liftC":{"title":"Glutes + Legs + Back","blurb":"Hip thrusts lead again (they climb fastest of anything you do), lunges bring back cheerleader legs, and a double dose of back work rounds it out. The anti-twist core finisher tightens your middle without a single crunch - you get plenty of those in class.","restDefaultSeconds":90,"warmup":"4-5 easy minutes on the bike or incline treadmill, then one smooth lighter set of hip thrusts before your working sets.","shortVersion":{"keep":[0,2,3],"sets":2},"exercises":[{"exerciseId":"hip_thrust","sets":3,"week1Sets":2,"work":{"type":"reps","count":10},"block3Count":8,"ladderStart":"25 lb dumbbell","restSeconds":120},{"exerciseId":"db_reverse_lunge","sets":2,"week1Sets":2,"work":{"type":"reps","count":8,"perSide":true},"ladderStart":"just your bodyweight","restSeconds":90},{"exerciseId":"lat_pulldown_neutral","sets":3,"week1Sets":2,"work":{"type":"reps","count":10},"ladderStart":"50 lb on the stack","restSeconds":90},{"exerciseId":"one_arm_db_row","sets":3,"week1Sets":2,"work":{"type":"reps","count":10,"perSide":true},"ladderStart":"20 lb dumbbell","restSeconds":90},{"exerciseId":"pallof_press","sets":2,"week1Sets":2,"work":{"type":"reps","count":10,"perSide":true},"ladderStart":"15 lb on the cable stack","restSeconds":60}],"optionalFinisher":{"exerciseId":"db_step_up","weeks":[9,12],"sets":2,"work":{"type":"reps","count":8,"perSide":true},"ladderStart":"10 lb dumbbells","restSeconds":60}},"open":{"title":"Class Day","card":"No weights today - this is a Sculpt day. Your classes are half this program: the sweat, the reps, the room. Book whichever time works and log it here after.","noClassNote":"No class today? Totally fine - the schedule flexes. A walk counts. Sunday is the only day the plan asks nothing of you.","logButton":"I went to Sculpt 🔥","loggedTitle":"Class logged.","effortPrompt":"How'd it go?","efforts":[{"id":"chill","emoji":"😌","label":"chill"},{"id":"solid","emoji":"😅","label":"solid"},{"id":"melted","emoji":"🥵","label":"melted"}],"hydrationNote":"Now the important part: a big glass of water with a pinch of salt or an electrolyte packet. You sweat way more in there than it feels like - tomorrow's workout will thank you.","eveningNote":"If it was an evening class, a cool shower helps you wind down for sleep."},"rest":{"title":"Rest Day","card":"Fully off, on purpose. Rest is when your body actually builds the muscle you worked for this week. Walk, stretch, see people, sleep in a little. You earned this one."}},"exercises":{"goblet_squat":{"name":"Goblet Squat","setup":"Hold one dumbbell vertically against your chest with both hands, like you're hugging it. Feet a little wider than hips, toes turned out slightly.","how":"Sit straight down between your legs - as deep as feels comfortable - then stand back up. Chest stays proud the whole time.","feel":"Thighs and glutes. The dumbbell hug keeps your back happy.","cues":["Chest up, elbows inside your knees","Whole foot stays flat","Stand up like you mean it"],"ladder":["15 lb dumbbell","20 lb dumbbell","25 lb dumbbell","30 lb dumbbell","35 lb dumbbell","40 lb dumbbell","45 lb dumbbell","50 lb dumbbell","55 lb dumbbell","60 lb dumbbell"],"why":"quads get volume in Sculpt, but never with real load - this is the load","media":{"imgA":"goblet_squat_a.jpg","imgB":"goblet_squat_b.jpg","credit":"free-exercise-db (public domain)"}},"db_rdl":{"name":"Dumbbell Romanian Deadlift","setup":"A dumbbell in each hand resting on the front of your thighs. Feet hip-width, soft bend in the knees.","how":"Push your hips straight back (like closing a car door with your butt) and let the dumbbells slide down your thighs to about mid-shin. Then drive your hips forward to stand tall.","feel":"The whole back of your legs - hamstrings stretching on the way down, glutes finishing at the top.","cues":["Hips go back, not down","Dumbbells stay close - practically touching your legs","Flat back, long spine"],"ladder":["15 lb dumbbells","20 lb dumbbells","25 lb dumbbells","30 lb dumbbells","35 lb dumbbells","40 lb dumbbells","45 lb dumbbells","50 lb dumbbells"],"why":"none - Sculpt never loads your hamstrings. This is all yours","media":{"imgA":"db_rdl_a.jpg","imgB":"db_rdl_b.jpg","credit":"free-exercise-db (public domain)"}},"lat_pulldown_wide":{"name":"Lat Pulldown (wide grip)","setup":"Sit at the lat pulldown machine, thighs snug under the pads. Grab the wide bar a bit outside your shoulders.","how":"Pull the bar down to the top of your chest while your elbows drive down and back. Let it rise back up with control - get a big stretch at the top.","feel":"The sides of your back, like wings. A little biceps is fine.","cues":["Pull with your elbows, not your hands","Chest up to meet the bar","Slow on the way up"],"ladder":["35 lb on the stack","40 lb on the stack","45 lb on the stack","50 lb on the stack","55 lb on the stack","60 lb on the stack","70 lb on the stack","80 lb on the stack","90 lb on the stack","100 lb on the stack","110 lb on the stack"],"why":"zero - Sculpt has no real pulling. This builds the back that makes waists look snatched","media":{"imgA":"lat_pulldown_wide_a.jpg","imgB":"lat_pulldown_wide_b.jpg","credit":"free-exercise-db (public domain)"}},"seated_cable_row":{"name":"Seated Cable Row","setup":"Sit at the cable row, feet on the plates, knees soft. Grab the V-handle and sit tall with arms long.","how":"Pull the handle to your belly button, squeezing your shoulder blades together. Let it return slowly until your arms are long again.","feel":"The middle of your back, between the shoulder blades.","cues":["Shoulder blades pinch together","Sit tall - no leaning way back","Slow return"],"ladder":["30 lb on the stack","35 lb on the stack","40 lb on the stack","45 lb on the stack","50 lb on the stack","55 lb on the stack","60 lb on the stack","70 lb on the stack","80 lb on the stack","90 lb on the stack"],"why":"Sculpt's 5 lb rows don't count - this is where posture gets built","media":{"imgA":"seated_cable_row_a.jpg","imgB":"seated_cable_row_b.jpg","credit":"free-exercise-db (public domain)"}},"suitcase_carry":{"name":"Suitcase Carry","setup":"One heavy-ish dumbbell in one hand, hanging at your side like a suitcase. Stand tall.","how":"Walk 30 seconds tall and controlled - the weight will try to tip you sideways; don't let it. Switch hands, walk back.","feel":"Your side abs and grip, working overtime to keep you perfectly upright. This is ab work that doesn't look like ab work.","cues":["Shoulders level - don't lean","Walk like there's a book on your head","Squeeze the handle hard"],"ladder":["25 lb dumbbell","30 lb dumbbell","35 lb dumbbell","40 lb dumbbell","45 lb dumbbell","50 lb dumbbell","55 lb dumbbell","60 lb dumbbell"],"why":"your abs get crunches in Sculpt - this trains the deep waist muscles Sculpt never touches","media":{"imgA":"suitcase_carry_a.svg","imgB":"suitcase_carry_b.svg","credit":"drawn for this program"}},"seated_leg_curl":{"name":"Seated Leg Curl","setup":"Sit in the machine, pad on the back of your ankles, thigh pad snug.","how":"Curl your heels down and under you as far as they go, pause, return slowly.","feel":"Hamstrings, isolated.","cues":["Full squeeze at the bottom","Slow return","Toes pointed slightly up"],"ladder":["30 lb on the stack","40 lb on the stack","50 lb on the stack","60 lb on the stack","70 lb on the stack","80 lb on the stack","90 lb on the stack"],"why":"zero - hamstrings are Sculpt's most ignored muscle","media":{"imgA":"seated_leg_curl_a.jpg","imgB":"seated_leg_curl_b.jpg","credit":"free-exercise-db (public domain)"}},"leg_press":{"name":"Leg Press","setup":"Sit in the leg press, feet on the platform about hip-width, mid-platform height. (Machines vary - the number is the total weight showing, whether it's a pin stack or plates.)","how":"Lower the platform toward you until your knees are around 90 degrees or a bit deeper, then press away without slamming your knees straight.","feel":"Thighs and glutes. This machine is where you get to be impressively strong, fast.","cues":["Whole foot pushes, heels especially","Knees track over toes","Don't lock out hard at the top"],"ladder":["70 lb","90 lb","110 lb","130 lb","150 lb","170 lb","190 lb","210 lb","230 lb","250 lb","270 lb","290 lb"],"why":"chair pose is 0 lb - this is the loaded version, and the number will climb fast","media":{"imgA":"leg_press_a.jpg","imgB":"leg_press_b.jpg","credit":"free-exercise-db (public domain)"}},"hip_thrust":{"name":"Hip Thrust","setup":"Sit on the floor with your upper back against a bench, knees bent, feet flat. Weight sits on your hips (fold a mat or use the bar pad when you graduate to the barbell).","how":"Drive through your heels and lift your hips until your body is a flat tabletop from knees to shoulders. Squeeze at the top for a second, lower with control.","feel":"Glutes, almost exclusively. If your lower back complains, tuck your chin and think 'ribs down.'","cues":["Chin tucked, look at your knees","Squeeze the top like you're cracking a walnut","Shins vertical at the top"],"ladder":["25 lb dumbbell","30 lb dumbbell","35 lb dumbbell","40 lb dumbbell","empty barbell (45 lb)","barbell + 10 lb (55 lb)","barbell + 20 lb (65 lb)","barbell + 30 lb (75 lb)","barbell + 50 lb (95 lb)","barbell + 70 lb (115 lb)","barbell + 90 lb (135 lb)","barbell + 110 lb (155 lb)","barbell + 140 lb (185 lb)"],"progressNote":"When the page moves you from dumbbells to the barbell, ask your coach to walk you through the setup - it takes one session to feel natural and then it's your favorite lift.","why":"donkey kicks are a warm-up - this is the single best glute exercise that exists, with real weight","media":{"imgA":"hip_thrust_a.jpg","imgB":"hip_thrust_b.jpg","credit":"free-exercise-db (public domain)"}},"chest_supported_db_row":{"name":"Chest-Supported Dumbbell Row","setup":"Set a bench to about 45 degrees and lie face-down on it with a dumbbell in each hand hanging straight down.","how":"Row both dumbbells up toward your hips, squeezing your shoulder blades, then lower slowly. The bench holds your posture so your back muscles do all the work.","feel":"Mid and upper back.","cues":["Pull toward your hips, not your armpits","Squeeze for a beat at the top","Let your arms hang fully between reps"],"ladder":["15 lb dumbbells","20 lb dumbbells","25 lb dumbbells","30 lb dumbbells","35 lb dumbbells","40 lb dumbbells","45 lb dumbbells"],"why":"zero","media":{"imgA":"chest_supported_db_row_a.jpg","imgB":"chest_supported_db_row_b.jpg","credit":"free-exercise-db (public domain)"}},"incline_db_press":{"name":"Incline Dumbbell Press (neutral grip)","setup":"Bench at about 30-45 degrees. A dumbbell in each hand at shoulder level, palms facing each other.","how":"Press both dumbbells up and slightly together until your arms are long, then lower with control to shoulder level.","feel":"Chest and the front of your shoulders. This is your ONLY pressing of the week on purpose - Sculpt gives you plenty.","cues":["Palms face each other the whole time","Wrists stacked over elbows","Lower to a comfortable stretch, no bouncing"],"ladder":["10 lb dumbbells","12 lb dumbbells","15 lb dumbbells","20 lb dumbbells","25 lb dumbbells","30 lb dumbbells","35 lb dumbbells"],"why":"high - Sculpt hammers pressing, so this stays light and small on purpose. If your shoulders ever feel cranky, tell your coach","media":{"imgA":"incline_db_press_a.jpg","imgB":"incline_db_press_b.jpg","credit":"free-exercise-db (public domain)"}},"hip_abduction_machine":{"name":"Hip Abduction Machine","setup":"The seated machine where the pads sit outside your knees and you push outward.","how":"Push your knees apart against the pads, pause a second at the widest point, come back with control.","feel":"The sides of your glutes - the muscles that give the 'shelf' shape from the side.","cues":["Lean slightly forward for more glute","Pause at the top","Don't let the stack slam"],"ladder":["50 lb on the stack","60 lb on the stack","70 lb on the stack","80 lb on the stack","90 lb on the stack","100 lb on the stack","110 lb on the stack","120 lb on the stack"],"why":"fire hydrants, but with actual resistance","media":{"imgA":"hip_abduction_machine_a.jpg","imgB":"hip_abduction_machine_b.jpg","credit":"free-exercise-db (public domain)"}},"back_extension_45":{"name":"45-Degree Back Extension","setup":"Set the pad so it sits at the crease of your hips. Hook your heels in, cross your arms.","how":"Hinge down over the pad with a long back, then squeeze your glutes to bring your body back up to a straight line - no higher.","feel":"Glutes and hamstrings. Squeeze your glutes at the top and it's a glute exercise; that's the version you want.","cues":["Glutes lift you, not your lower back","Stop at straight - no banana","Slow and smooth"],"ladder":["just your bodyweight","10 lb dumbbell hugged to chest","15 lb dumbbell hugged to chest","20 lb dumbbell hugged to chest","25 lb dumbbell hugged to chest"],"why":"zero","media":{"imgA":"back_extension_45_a.jpg","imgB":"back_extension_45_b.jpg","credit":"free-exercise-db (public domain)"}},"db_reverse_lunge":{"name":"Dumbbell Reverse Lunge","setup":"Stand tall, dumbbells at your sides (or hands on hips for bodyweight).","how":"Step one foot back and lower until both knees are around 90 degrees, then push through the front heel to stand. All reps one side, then switch.","feel":"Front leg's glute and thigh. Cheerleader legs remember this pattern - you'll be good at it.","cues":["Front heel does the work","Torso tall, slight lean forward is fine","Soft, quiet back knee"],"ladder":["just your bodyweight","8 lb dumbbells","10 lb dumbbells","15 lb dumbbells","20 lb dumbbells","25 lb dumbbells","30 lb dumbbells"],"why":"Sculpt lunges are unloaded pulses - this is full range with real weight, kept to 2 sets so your legs don't hate you","media":{"imgA":"db_reverse_lunge_a.jpg","imgB":"db_reverse_lunge_b.jpg","credit":"free-exercise-db (public domain)"}},"lat_pulldown_neutral":{"name":"Lat Pulldown (neutral grip)","setup":"Same machine as Monday, but use the handle where your palms face each other (the V-handle or the close parallel grips).","how":"Pull the handle down to your upper chest, elbows tucking toward your ribs. Control it back up and let your arms fully lengthen.","feel":"Back and a bit more biceps than the wide grip. Palms-facing is usually the strongest grip - enjoy it.","cues":["Elbows to your back pockets","Tall chest","Full stretch at the top"],"ladder":["35 lb on the stack","40 lb on the stack","45 lb on the stack","50 lb on the stack","55 lb on the stack","60 lb on the stack","70 lb on the stack","80 lb on the stack","90 lb on the stack","100 lb on the stack","110 lb on the stack"],"why":"zero - all yours","media":{"imgA":"lat_pulldown_neutral_a.jpg","imgB":"lat_pulldown_neutral_b.jpg","credit":"free-exercise-db (public domain)"}},"one_arm_db_row":{"name":"One-Arm Dumbbell Row","setup":"Left knee and left hand on a bench, right foot on the floor, dumbbell in your right hand. Flat back, like a table.","how":"Row the dumbbell up to your hip, elbow skimming your side, then lower long and slow. All reps, then switch sides.","feel":"One side of your back at a time - you'll feel exactly what a row should feel like.","cues":["Elbow to hip pocket","No twisting - hips stay square","Full stretch at the bottom"],"ladder":["20 lb dumbbell","25 lb dumbbell","30 lb dumbbell","35 lb dumbbell","40 lb dumbbell","45 lb dumbbell","50 lb dumbbell","55 lb dumbbell","60 lb dumbbell"],"why":"zero","media":{"imgA":"one_arm_db_row_a.jpg","imgB":"one_arm_db_row_b.jpg","credit":"free-exercise-db (public domain)"}},"pallof_press":{"name":"Pallof Press","setup":"Set a cable to chest height, stand sideways to the machine, hold the handle with both hands at your chest, step out until the cable is taut.","how":"Press the handle straight out from your chest and hold for a breath - the cable will try to twist you toward the machine; don't let it. Pull back in. All reps, then face the other way.","feel":"Your entire midsection bracing quietly. This is the ab work that flattens and tightens - no crunching required (you get plenty of those in Sculpt).","cues":["Ribs down, glutes on","Press slow, hold two seconds","Don't lean away from the machine - resist the twist"],"ladder":["10 lb on the cable stack","15 lb on the cable stack","20 lb on the cable stack","25 lb on the cable stack","30 lb on the cable stack","35 lb on the cable stack"],"why":"the anti-crunch: trains the deep corset muscles Sculpt's ab block misses","media":{"imgA":"pallof_press_a.jpg","imgB":"pallof_press_b.jpg","credit":"free-exercise-db (public domain)"}},"db_step_up":{"name":"Dumbbell Step-Up","setup":"A knee-height bench or box, dumbbells at your sides.","how":"Step up with one foot and drive through that heel to stand fully on the box - try not to push off the bottom leg. Step down with control. All reps, then switch.","feel":"Glute and thigh of the working leg.","cues":["Top leg does everything","Control the way down","Stand all the way up at the top"],"ladder":["10 lb dumbbells","15 lb dumbbells","20 lb dumbbells","25 lb dumbbells","30 lb dumbbells"],"why":"low","media":{"imgA":"db_step_up_a.jpg","imgB":"db_step_up_b.jpg","credit":"free-exercise-db (public domain)"}}},"guide":{"intro":["Twelve weeks. Three ~40-minute gym sessions a week, always laid out exactly - the exercise, the sets, the reps, the weight to grab. Your classes stay yours; Sundays are always fully off.","This program was built for exactly one person. Every choice in it traces back to you: what you already do three times a week, what you want to change, and how you actually live."],"sections":[{"id":"why-gym-days","tag":"plan","title":"Why your gym days look like this","body":["You'll notice what's missing: no crunches, no bicep curls, no shoulder raises, almost no pressing. That's not an oversight - your Sculpt classes already deliver all of that in serious volume, three times a week, and doing it twice would just be extra soreness with nothing to show for it.","So your gym time goes to what classes can't do: heavy legs, real glute loading, and the back strength that changes how you stand and how everything fits. Light weights for lots of reps you already have; the gym is where the weights actually climb."]},{"id":"getting-stronger","tag":"stronger","title":"How you get stronger","body":["Every exercise has a ladder of weights and an exact rep count - no ranges, no deciding. You start at a friendly rung, and the page moves you up when you're ready: when you tap 'too easy', or automatically after you've owned a weight for three sessions. If something feels like a grind, tap 'felt heavy' and the next session hands you one step lighter. The reps stay the same; the weight is the dial.","Week one is two sets of everything on purpose: it's for learning the movements and finding your real starting weights. In week two, two machines get one special 'as many good reps as you can' set - most people discover they're stronger than they thought, and the weights get corrected up.","Expect most of your working weights to roughly double over the twelve weeks. That's not hype - it's what reliably happens when someone strong-but-new starts lifting with a plan."]},{"id":"when-youll-notice","tag":"stronger","title":"When you'll notice","body":["The order is always the same: first the weights move (weeks 2-4), then clothes and posture (somewhere in the middle), then the mirror catches up (weeks 8-12). If you're at week 3 and the mirror hasn't noticed yet, nothing is wrong - you are exactly on schedule, and the numbers on your ladders are the proof it's working.","The page never asks you to weigh, measure, or photograph anything. Strength, sessions, and how you feel are the scoreboard here."]},{"id":"missed-days","tag":"life","title":"Missed days","body":["You will miss days. That's not a prediction about you - it's true of everyone, and this program was built expecting it. Missed workouts are deleted, never owed: there are no make-ups, no falling behind, and nothing here ever counts what you didn't do.","If you're away more than a week, the page automatically hands you a lighter welcome-back workout designed to feel good, and your session count picks up right where it left off. It only ever goes up. The workout after a break is the hardest one in fitness - which is why it gets the biggest celebration."]},{"id":"sculpt-classes","tag":"classes","title":"Your Sculpt classes","body":["Your classes are not extra - they are half of this program. Three times a week they give you what a gym floor can't: a room full of energy, an instructor's voice, hundreds of reps, and the kind of sweat that clears your head. The plan never schedules them because that freedom is the point - you book whichever times fit your week, then log them in the app with one tap.","The gym days are designed around your classes on purpose. Classes press, pulse, and crunch - so the gym doesn't. The gym loads your legs, glutes, and back with real weight - which classes can't. Neither one repeats the other; together they cover everything.","One habit that makes both better: water with electrolytes after every class. The heated room takes more out of you than it feels like, and replacing it is what makes the next morning's lift feel strong."]},{"id":"sundays","tag":"life","title":"Sundays","body":["Always off. Every single week. Rest is when your body actually builds what you trained for - a full day off isn't a break from the program, it is the program."]}],"coach":{"title":"Your coach - the other half of this","intro":["This page is for the gym. Your coach - the chat that lives in the macy-coach folder on your Mac - is for everything else. Open the folder, open the chat, say anything in your own words. It already knows your whole plan and everything you have logged here, so you never have to explain yourself.","No commands, no magic words. Tap any of these to see what to say. Tap the quote itself and it copies, so you can paste it straight in."],"spotlight":{"emoji":"🗓️","title":"Sunday night, two minutes","when":"The habit that makes the whole week easy: your days, your times, anything that needs to move.","say":"ok what does this week look like"},"firstWeeksTitle":"New here? Start with these three","firstWeeks":["sunday","moved","dontwant"],"groups":[{"id":"notfeeling","emoji":"😮‍💨","title":"When you are not feeling it","peek":"no motivation · no time","rows":[{"id":"dontwant","emoji":"🛋️","title":"You do not want to go","when":"Wiped, sore, or just not in the mood. Have this conversation instead of skipping - it usually ends with a smaller version, not a lecture.","say":"honestly i really do not want to go tonight"},{"id":"notime","emoji":"⏱️","title":"You have got 25 minutes","when":"A short version of today that keeps the parts that actually matter. It counts exactly the same.","say":"i have got like 25 min tops today, what do i do"}]},{"id":"weekmoves","emoji":"📅","title":"When the week moves","peek":"one day · a whole trip","rows":[{"id":"moved","emoji":"🔀","title":"A day stopped working","when":"Something landed on a lifting day, or you skipped one and want it later this week. This page updates itself.","say":"friday is not happening, can i lift saturday instead"},{"id":"travel","emoji":"✈️","title":"You are going out of town","when":"Tell it the dates and what you will have. Short travel workouts land on this page before you leave, and your normal plan comes back on its own.","say":"i am gone tues to fri, the hotel gym has dumbbells and that is it"}]},{"id":"morethanaday","emoji":"🌊","title":"When it is more than one day","peek":"everything is heavy · you have been gone","rows":[{"id":"heavy","emoji":"🌊","title":"Everything is heavy right now","when":"A brutal stretch, barely sleeping, running on fumes. Your training gets turned down for a while instead of off.","say":"i have barely slept all week and everything feels like a lot rn"},{"id":"back","emoji":"🌤️","title":"You have been away a while","when":"No explaining, no catching up, nothing owed. Say hi and today is already built to feel good.","say":"hey i am back"}]},{"id":"wonder","emoji":"💭","title":"Stuff you will wonder about","peek":"felt weird · hate an exercise · cannot see it yet · why is it like this","rows":[{"id":"weird","emoji":"🤨","title":"That felt weird","when":"You did the thing but felt it in the wrong place, or your balance was strange. Describe it and you will get the one cue that fixes it.","say":"i felt hip thrusts in my quads instead of my butt?? what am i doing wrong"},{"id":"dread","emoji":"🔁","title":"An exercise you dread","when":"If you hate one, it is costing more than it is giving. There is always a swap that does the same job.","say":"i cannot with the leg press anymore, give me literally anything else"},{"id":"cantsee","emoji":"📈","title":"You cannot see it yet","when":"Week 3 and the mirror is not talking. Your coach has every number you have actually put up - that is the part that moves first.","say":"is this actually doing anything, i cannot tell"},{"id":"anything","emoji":"💬","title":"Anything else","when":"Why your plan looks like this, what a machine is called, whether something counts. There are no wrong questions here.","say":"wait why are there no crunches in my plan"}]}],"bigger":{"note":"These are longer conversations - they use more of Claude's energy for the day, so save them for late at night or early in the morning, one at a time.","items":[{"title":"Monthly recap","when":"Once a month: your real numbers turned into something worth screenshotting.","say":"gimme my wrapped"},{"title":"Check-in","when":"Around week 4 and week 8, or whenever things feel off - the conversation that retunes the whole plan.","say":"can we do a check-in, i want to talk through some stuff"},{"title":"Life changed","when":"New job, new hours - the whole rotation gets rebuilt around your new week.","say":"i got a job!! my whole week is different now"},{"title":"The next chapter","when":"Once, at the end of week 12: everything you built becomes the start of a brand-new program.","say":"i am almost done with the 12 weeks, what happens next"}]},"utility":{"emoji":"🛠️","title":"This page looks wrong","when":"You changed something with your coach and this page still shows the old version. Two-minute fix.","say":"my page is not updating, it still says the old thing"}}},"copy":{"howItWorks":["Every workout tells you exactly what to do: the exercise, the sets, the reps, and the exact weight to grab. No deciding, no guessing.","Your lifting days move around week to week on purpose - the page always knows which days are yours, so you never have to remember. Sundays are always fully off.","Tap the circle after every set - it fills up as you go and turns green when the exercise is done. On class days, one tap logs your Sculpt. That's the whole job.","Getting stronger happens on a schedule: your weights start moving around week 2-4, and the mirror catches up around week 8-12. If you're at week 3 and don't see it yet - that is exactly on schedule.","The session counter only goes up. There is no streak to break. Ever."],"week1Note":"This week is 2 sets of everything and the weights are starting guesses. If a weight feels easy, tap 'too easy' - if it feels like a grind, tap 'felt heavy' - and the page hands you the right one next time. Finishing is the whole win this week.","amrapNote":"Special set today: on the last set, do as many good reps as you can - stop when the next rep would get ugly. This teaches you what 'working hard' actually feels like, and it's usually more than you think.","welcomeBackTitle":"Welcome back. This one's built to feel good.","welcomeBackNote":"Life happened - that's allowed, and it didn't undo anything. The research is actually clear on this: missing days doesn't erase a habit. Today is a lighter version so you walk out feeling strong, not sore. The counter picks up right where it left off.","welcomeBackDone":"THAT is the hardest workout in this whole program - the one after a break. You just did it. Everything from here is momentum.","classCelebrations":["Class {c} logged. Your classes are half the program - and you keep showing up for them.","That's {c} classes. The room's energy plus your gym days - that's the whole formula working.","Class {c} in the books. Sweat now, strut later."],"celebrations":["Session {n} in the books. That number never goes down.","Done. You showed up and did every bit of it.","That's {n} sessions of telling your own body what's up.","Finished. Somewhere in there you got a little stronger than yesterday.","Session {n} done. Consistency looks good on you.","Logged. Nobody handed you that one.","That's {n}. You are officially a person who lifts.","Done, and done properly. Every set of it.","Session {n}. The version of you from six weeks ago is watching this.","Finished. Go drink some water h","intro":"Go down to the gym with no plan to work out. Find these five things, tap them off, and come back upstairs. That's the whole assignment.","items":["The dumbbell rack - where the 15s, 20s and 25s live","The leg press","The lat pulldown (and its thigh pads)","A bench you can set your shoulders against","The cable machine"],"note":"Nobody down there is looking at you, and you don't have to touch anything. This is just so Monday isn't the first time you've seen the room.","done":"That's the room handled. Monday you walk in already knowing where everything is - which is the part most people never get."},"sundayExtra":"Week {week} of 12 done.","sundayCoachLine":"Sunday-night move: ask your coach on the Mac, \"What's my week look like?\" Two minutes tonight and next week runs itself."},"letters":[],"lettersMeta":{"title":"Letters","intro":"These show up on their own. You don't have to do anything.","from":"For you"},"photos":{"header":[],"rest":[],"celebrate":[]}};
var STORE_KEY = "macy-coach-v1";

/* ---------- state ---------- */
function loadState(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
var S = loadState();
if(!S.setDone) S.setDone = {};
if(!S.rung) S.rung = {};
if(!S.rungBest) S.rungBest = {};
if(!S.easyTap) S.easyTap = {};
if(!S.holds) S.holds = {};
if(!S.completions) S.completions = [];
if(!S.exDoneCount) S.exDoneCount = {};
if(!S.workStart) S.workStart = {};
if(!S.heavyTap) S.heavyTap = {};
if(!S.droppedToday) S.droppedToday = {};
if(!S.prefs) S.prefs = {};
if(!S.milesSeen) S.milesSeen = [];
if(!S.feel) S.feel = {};
if(S.muteTimer === undefined) S.muteTimer = false;
// migrate old boolean checks into set counts, then retire the key: it was a duplicate
// of setDone that nothing read, and it was ~a third of every sync payload.
if(S.checks){
  Object.keys(S.checks).forEach(function(ck){ if(S.checks[ck] === true && S.setDone[ck] === undefined) S.setDone[ck] = 99; });
  delete S.checks;
}
// high-water marks: what she has ever reached, so a "felt heavy" drop can never
// delete an achievement she earned (nothing on this page may go down).
Object.keys(S.rung).forEach(function(id){
  if(S.rungBest[id] === undefined || S.rung[id] > S.rungBest[id]) S.rungBest[id] = S.rung[id];
});

function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(S)); scheduleSync(); }
function noteRung(exId, idx){
  S.rung[exId] = idx;
  if(S.rungBest[exId] === undefined || idx > S.rungBest[exId]) S.rungBest[exId] = idx;
}
// Old per-day bookkeeping is dead weight the moment its day passes. Keep a rolling
// window so the synced state can't grow without bound across a whole program.
function pruneState(){
  var cutoff = new Date(NOW); cutoff.setDate(NOW.getDate() - 45);
  var keep = dateKey(cutoff), n = 0;
  ["setDone","workStart","bumpedToday","droppedToday"].forEach(function(k){
    if(!S[k]) return;
    Object.keys(S[k]).forEach(function(key){
      if(String(key).slice(0,10) < keep){ delete S[k][key]; n++; }
    });
  });
  return n;
}

/* ---------- dates ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseLocalDate(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function niceDate(iso){ return parseLocalDate(iso).toLocaleDateString("en-US",{month:"long",day:"numeric"}); }
function today(){
  var m = location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/);
  if(m){
    if(window.history && history.replaceState){ try{ history.replaceState(null, "", location.pathname + location.hash); }catch(e){} }
    return parseLocalDate(m[1]);
  }
  return new Date();
}
var NOW = today();
var TKEY = dateKey(NOW);
var START = parseLocalDate(DATA.meta.startDate);
var DAYNAMES = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
var DAYSHORT = ["S","M","T","W","T","F","S"];
var FULLSHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function weekNumber(d){
  var diff = Math.floor((d - START) / 86400000);
  if(diff < 0) return 0;
  return Math.floor(diff / 7) + 1;
}
var WEEK = weekNumber(NOW);
var PRESTART = WEEK < 1;
// Before a FIRST program begins there is no history to have — anything on the device
// is setup/demo residue, so start her clean. Guarded to version 1: a later chapter's
// history legitimately predates its own start date and must never be touched.
if(PRESTART && (DATA.meta.version||1) === 1 && (S.completions.length || Object.keys(S.rung).length)){
  S = { setDone:{}, rung:{}, rungBest:{}, easyTap:{}, holds:{}, completions:[], exDoneCount:{},
        workStart:{}, heavyTap:{}, droppedToday:{}, prefs: S.prefs || {}, muteTimer: !!S.muteTimer,
        milesSeen: [], feel: {}, seenIntro: S.seenIntro, seenA2HS: S.seenA2HS, restoredOnce: true };
  saveState();
}
// The coach's only write channel into her weights. Editing ladderStart in program.json
// does nothing once she has bumped an exercise (rungIndex prefers S.rung), so a dated
// instruction here is how /checkin and /welcome-back actually move a weight. Applied
// exactly once per date stamp, then remembered.
(function applyRungSets(){
  var rs = DATA.meta.rungSet || {};
  if(!S.rungSetApplied) S.rungSetApplied = {};
  var changed = false;
  Object.keys(rs).forEach(function(id){
    var r = rs[id];
    if(!r || typeof r.index !== "number" || !r.at) return;
    if(S.rungSetApplied[id] === r.at) return;
    var ladder = (DATA.exercises[id] || {}).ladder || [];
    if(!ladder.length) return;
    noteRung(id, Math.max(0, Math.min(r.index, ladder.length - 1)));
    S.rungSetApplied[id] = r.at;
    delete S.easyTap[id]; delete S.heavyTap[id]; S.holds[id] = false;
    changed = true;
  });
  if(changed) saveState();
})();
if(pruneState()) saveState();
/* ---------- steady mode ---------- */
var STEADY_CFG = DATA.meta.steady || null;
var STEADY = !!(STEADY_CFG && STEADY_CFG.on) && (!STEADY_CFG.until || TKEY <= STEADY_CFG.until);
var STEADY_SIG = STEADY ? ("on|" + (STEADY_CFG.since || "")) : "off";
(function reconcileSteady(){
  if(S.steadyPhase === STEADY_SIG) return;
  var wasOn = String(S.steadyPhase || "off").indexOf("on|") === 0;
  if(wasOn && !STEADY){
    // Leaving steady: restart every ladder clock. She keeps every session she did — no
    // automatic climb is owed for weeks the plan deliberately held, and nothing should
    // land on her first full-load day back as a surprise.
    if(!S.lastBumpAt) S.lastBumpAt = {};
    Object.keys(S.exDoneCount || {}).forEach(function(id){ S.lastBumpAt[id] = S.exDoneCount[id] || 0; });
    S.steadyEndedAt = TKEY;
  }
  S.steadyPhase = STEADY_SIG;
  saveState();
})();
var WEEKCLAMP = Math.min(Math.max(WEEK,1), DATA.meta.programWeeks);
function clampWeek(w){ return Math.min(Math.max(w,1), DATA.meta.programWeeks); }
function blockFor(week){
  for(var i=0;i<DATA.blocks.length;i++){ var b=DATA.blocks[i]; if(week>=b.weeks[0] && week<=b.weeks[1]) return b; }
  return DATA.blocks[DATA.blocks.length-1];
}
function layoutFor(week){
  var n = DATA.scheduleByWeek.length;
  return DATA.scheduleByWeek[week < 1 ? 0 : ((week-1) % n)].days;
}
var OVR = DATA.meta.overrides || {};
function baseKeyFor(d){ return layoutFor(weekNumber(d))[DAYNAMES[d.getDay()]]; }
function sessionKeyFor(d){ return OVR[dateKey(d)] || baseKeyFor(d); }
function isLift(key){ return typeof key === "string" && key.indexOf("lift") === 0; }

/* ---------- transient ui state ---------- */
var JUST = { check: null, finished: false, classLogged: false };
var PREV_PCT = null, RENDER_PCT = null;
var BACK_TO = "plan";
var TIMER = null; var TIMER_IV = null;   // {ck, endAt} running -> {ck, done:true} finished -> null
var NOTE = null;
var CHIME_PRIMED = false;
var TITLE_IV = null;
var BASE_TITLE = document.title || "";
var ELAPSED_IV = null;
var WAKE = null;

/* ---------- completions helpers ---------- */
function liftCount(){ var n=0; S.completions.forEach(function(c){ if(c.session !== "sculpt") n++; }); return n; }
function classCount(){ var n=0; S.completions.forEach(function(c){ if(c.session === "sculpt") n++; }); return n; }
function totalCount(){ return S.completions.length; }
function completionOn(dkey){ for(var i=0;i<S.completions.length;i++){ if(S.completions[i].date===dkey) return S.completions[i]; } return null; }
function lastCompletionDate(){ if(!S.completions.length) return null; return parseLocalDate(S.completions[S.completions.length-1].date); }
function sortCompletions(){ S.completions.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); }); }
function daysSinceLast(){ var l=lastCompletionDate(); if(!l) return null; return Math.floor((parseLocalDate(TKEY)-l)/86400000); }
function isWelcomeBack(key){
  if(!isLift(key)) return false;
  var gap = daysSinceLast();
  return gap !== null && gap > DATA.meta.welcomeBack.afterDaysAway;
}

/* ---------- ladders ---------- */
function rungIndex(exId, slot){
  if(S.rung[exId] !== undefined) return S.rung[exId];
  var idx = DATA.exercises[exId].ladder.indexOf(slot.ladderStart);
  return idx < 0 ? 0 : idx;
}
function startIndex(exId, slot){
  var idx = DATA.exercises[exId].ladder.indexOf(slot.ladderStart);
  return idx < 0 ? 0 : idx;
}
function currentWeight(exId, slot){
  var ladder = DATA.exercises[exId].ladder;
  return ladder[Math.min(rungIndex(exId, slot), ladder.length-1)];
}
function weightNum(label){
  var m = label.match(/\((\d+(?:\.\d+)?)\s*lb\)/);
  if(m) return parseFloat(m[1]);
  m = label.match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}
function bumpPending(exId){
  if(S.holds[exId]) return false;
  if(S.heavyTap[exId]) return false;  // "felt heavy" outranks any pending climb
  if(S.easyTap[exId] && S.easyTap[exId] !== TKEY) return true;  // deferred: applies the NEXT session, never same-day
  if(STEADY) return false;            // steady pauses AUTOMATIC climbs only — her tap above still works
  var c = S.exDoneCount[exId] || 0;
  return c > 0 && c % 3 === 0 && (S.lastBumpAt||{})[exId] !== c;
}
function applyBumpIfPending(exId, slot){
  if(!bumpPending(exId)) return false;
  var ladder = DATA.exercises[exId].ladder;
  var idx = rungIndex(exId, slot);
  if(idx >= ladder.length-1) return false;
  noteRung(exId, idx + 1);
  delete S.easyTap[exId];
  if(!S.lastBumpAt) S.lastBumpAt = {};
  S.lastBumpAt[exId] = S.exDoneCount[exId] || 0;
  if(!S.bumpedToday) S.bumpedToday = {};
  S.bumpedToday[TKEY+"|"+exId] = true;
  saveState();
  return true;
}
function applyDropIfPending(exId, slot){
  // mirror of the easy-tap: "felt heavy" yesterday -> one rung lighter today, floor at rung 0
  if(!S.heavyTap[exId] || S.heavyTap[exId] === TKEY) return false;
  var idx = rungIndex(exId, slot);
  delete S.heavyTap[exId];
  if(!S.lastBumpAt) S.lastBumpAt = {};
  S.lastBumpAt[exId] = S.exDoneCount[exId] || 0;  // consume any pending count-bump so it can't undo the drop
  if(idx > 0){
    S.rung[exId] = idx - 1;   // deliberately not noteRung: a drop must never lower the high-water mark
    S.droppedToday[TKEY+"|"+exId] = true;
  }
  saveState();
  return true;
}

function esc(t){ var d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
function fmt(t, n){ return t.replace(/\{n\}/g, n).replace(/\{c\}/g, classCount()).replace(/\{week\}/g, WEEKCLAMP); }

function slotSets(slot, welcomeBack, wk){
  if(welcomeBack) return Math.min(DATA.meta.welcomeBack.sets, slot.sets);  // a comeback outranks steady
  var base = (wk === 1 && slot.week1Sets) ? slot.week1Sets : slot.sets;
  if(STEADY) return Math.max(2, Math.min(STEADY_CFG.setsCap || 2, base));
  return base;
}
function slotRest(slot){
  var s = slot.restSeconds;
  if(STEADY && STEADY_CFG.restMultiplier) s = Math.round(s * STEADY_CFG.restMultiplier / 15) * 15;
  return Math.min(300, Math.max(30, s));
}
// These finally make meta.welcomeBack.skipOptional/.skipAmrap load-bearing — both were
// validated but never read, with the behaviour hardcoded in three places.
function showAmrapFor(slot, welcomeBack, wk){
  if(!slot.amrapCalibration) return false;
  if(welcomeBack && DATA.meta.welcomeBack.skipAmrap !== false) return false;
  if(STEADY && STEADY_CFG.skipAmrap !== false) return false;
  return wk === DATA.progression.amrapWeek;
}
function showFinisher(fin, welcomeBack, wk){
  if(!fin) return false;
  if(welcomeBack && DATA.meta.welcomeBack.skipOptional !== false) return false;
  if(STEADY && STEADY_CFG.skipOptional !== false) return false;
  return wk >= fin.weeks[0] && wk <= fin.weeks[1];
}
function slotReps(slot, wk){
  var c = slot.work.count;
  if(slot.block3Count && wk >= 9) c = slot.block3Count;
  return c;
}
function rxText(slot, welcomeBack, wk){
  var sets = slotSets(slot, welcomeBack, wk);
  if(slot.work.type === "time") return sets + " × " + slot.work.seconds + " seconds" + (slot.work.perSide ? " each side" : "");
  return sets + " × " + slotReps(slot, wk) + (slot.work.perSide ? " each side" : "");
}

/* ---------- sync ---------- */
var SYNC = DATA.meta.sync;
var SYNC_STATUS = "";
var syncTimer = null;
var RESTORE_SETTLED = false;   // no push may race the first restore read (it could overwrite her history)
function scheduleSync(){
  if(!SYNC || !window.fetch) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(pushState, 8000);   // her taps are minutes apart; the exit flush is what actually matters
}
function pushState(){
  if(!SYNC || !window.fetch) return;
  // Never write an empty state over a remote we haven't successfully read. On a new
  // phone the boot fetch and boot push have no ordering, and an empty push winning
  // would erase her history from both ends with no way back.
  if(!RESTORE_SETTLED && !S.completions.length) return;
  if(!navigator.onLine){ SYNC_STATUS = "will sync when back online"; syncBadge(); return; }
  fetch(SYNC.endpoint + "/state", {
    method: "PUT",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ updatedAt: new Date().toISOString(), state: S })
  }).then(function(r){ SYNC_STATUS = r.ok ? "synced ✓" : "will sync later"; syncBadge(); })
    .catch(function(){ SYNC_STATUS = "will sync when back online"; syncBadge(); });
}
function syncBadge(){
  var el = document.getElementById("syncbadge");
  if(el && el.style !== undefined) el.textContent = SYNC_STATUS;
}
function bootSync(){
  if(!SYNC || !window.fetch){ RESTORE_SETTLED = true; return; }
  // restore: fresh install / new phone with an empty local state
  if(S.completions.length === 0 && !S.restoredOnce){
    fetch(SYNC.endpoint + "/state").then(function(r){ return r.json(); }).then(function(doc){
      if(doc && doc.state && doc.state.completions && doc.state.completions.length){
        doc.state.restoredOnce = true;
        S = doc.state;
        RESTORE_SETTLED = true;
        saveState();
        render();
      } else { S.restoredOnce = true; RESTORE_SETTLED = true; saveState(); }
      pushState();
    }).catch(function(){
      // read failed: we do NOT know what's up there, so we stay silent rather than
      // risk overwriting it. The next successful open will settle it.
      SYNC_STATUS = "will sync when back online"; syncBadge();
    });
  } else {
    RESTORE_SETTLED = true;
    pushState();
  }
  fetch(SYNC.endpoint + "/note").then(function(r){ return r.json(); }).then(function(n){
    if(n && n.id && n.text && n.id !== S.noteSeenId){
      NOTE = n;
      // record that it reached her screen, even if she never taps "Got it" — otherwise
      // one unacknowledged note mutes the coach's only outbound channel forever.
      if(S.noteShownId !== n.id){ S.noteShownId = n.id; S.noteShownAt = new Date().toISOString(); saveState(); }
      render();
    }
  }).catch(function(){});
}
if(window.addEventListener) window.addEventListener("online", function(){ pushState(); });
// The Finish tap is the last thing she does before pocketing the phone — flush it
// immediately rather than letting the idle timer lose the race with the screen lock.
function flushState(){
  if(!SYNC || !window.fetch) return;
  if(!RESTORE_SETTLED && !S.completions.length) return;
  if(syncTimer){ clearTimeout(syncTimer); syncTimer = null; }
  var body = JSON.stringify({ updatedAt: new Date().toISOString(), state: S });
  if(navigator.sendBeacon){
    try{ navigator.sendBeacon(SYNC.endpoint + "/state", new Blob([body], {type:"application/json"})); return; }catch(e){}
  }
  try{ fetch(SYNC.endpoint + "/state", { method:"PUT", headers:{"content-type":"application/json"}, body: body, keepalive: true }); }catch(e){}
}
if(window.addEventListener){
  window.addEventListener("pagehide", flushState);
  document.addEventListener("visibilitychange", function(){ if(document.hidden) flushState(); });
}

/* ---------- routing ---------- */
var PAGES = ["today","plan","program","progress"];
function parseRoute(){
  var h = (location.hash || "").replace(/^#/, "");
  if(!h) return { page: "today" };
  var parts = h.split("/");
  if(parts[0] === "day" && parts[1] && /^\d{4}-\d{2}-\d{2}$/.test(parts[1])) return { page: "day", date: parts[1] };
  if(parts[0] === "history") return { page: "history" };
  if(parts[0] === "letters") return { page: "letters" };
  if(parts[0] === "program" && parts[1]) return { page: "program", section: parts[1].replace(/[^a-z0-9\-]/g, "") };
  if(PAGES.indexOf(parts[0]) >= 0) return { page: parts[0] };
  return { page: "today" };
}
var ROUTE = parseRoute();
var LAST_RENDERED_HASH = null;
function nav(h){
  location.hash = h;
  ROUTE = parseRoute();
  render();
}
if(window.addEventListener) window.addEventListener("hashchange", function(){
  if(("#" + (LAST_RENDERED_HASH||"")) === (location.hash || "#")) return;
  ROUTE = parseRoute();
  render();
});

function weekStrip(){

  var liftNames = [];

  for(var i=0;i<7;i++){
    var d = new Date(start); d.setDate(start.getDate()+i);
    var k = dateKey(d);
    // days before the program starts belong to no week — never dress them as scheduled
    var key = k < DATA.meta.startDate ? "rest" : sessionKeyFor(d);
    var lift = isLift(key);
    if(lift) liftNames.push(FULLSHORT[d.getDay()]);

function estSessionVolume(session, welcomeBack, wk){

/* One true sentence a day. Every branch below is guarded by real state — this must
   never be able to say something that isn't so. Off days get a forward look, which
   is the whole point: four of her seven days used to have nothing to say. */
function subst(t, map){ return t.replace(/\{(\w+)\}/g, function(m, k){ return map[k] !== undefined ? map[k] : m; }); }
function shortOnToday(){ return !!(S.shortToday || {})[TKEY]; }
/* Photo rotation. Every pick is seeded from something stable (the date, the workout
   count, the rest-timer index) and never from Math.random — render() runs on every
   tap, and a photo that reshuffles mid-set would feel broken. */
function dayIndex(){
  var p = TKEY.split("-");
  return (parseInt(p[0],10)*372 + parseInt(p[1],10)*31 + parseInt(p[2],10));
}
function photoFrom(pool, seed){
  var list = (DATA.photos || {})[pool] || [];
  if(!list.length) return null;
  return list[((seed % list.length) + list.length) % list.length];
}
function photoTag(file, cls, alt){
  return '<img class="' + cls + '" src="./media/' + file + '" alt="' + esc(alt || "") + '" loading="lazy" decoding="async">';
}
function dailyLine(){
  var L = DATA.copy.dailyLines;
  if(!L || PRESTART) return "";
  var key = sessionKeyFor(NOW);
  var comp = completionOn(TKEY);
  var lift = isLift(key);

  if(!comp && (lift || key === "open") && L.milestoneNear){
    var n = totalCount() + 1;
    if([5,10,15,20,25,30,40,50].indexOf(n) >= 0) return subst(L.milestoneNear, { count: n });
  }
  if(lift && !comp){
    var sess = DATA.sessions[key];
    var wb = isWelcomeBack(key);
    var i, slot, id;
    // The header renders before the exercise cards apply pending bumps, so predict from
    // bumpPending rather than reading bumpedToday — otherwise the line is a render late.
    for(i = 0; i < sess.exercises.length; i++){
      slot = sess.exercises[i]; id = slot.exerciseId;
      var lad = DATA.exercises[id].ladder;
      var already = (S.bumpedToday || {})[TKEY + "|" + id];
      if(!L.climbToday) break;
      if(already) return subst(L.climbToday, { ex: DATA.exercises[id].name.toLowerCase(), weight: currentWeight(id, slot) });
      if(bumpPending(id) && rungIndex(id, slot) < lad.length - 1)
        return subst(L.climbToday, { ex: DATA.exercises[id].name.toLowerCase(), weight: lad[rungIndex(id, slot) + 1] });
    }
    for(i = 0; i < sess.exercises.length; i++){
      slot = sess.exercises[i]; id = slot.exerciseId;
      var c = S.exDoneCount[id] || 0;
      var room = rungIndex(id, slot) < DATA.exercises[id].ladder.length - 1;
      if(!S.holds[id] && !S.heavyTap[id] && room && c > 0 && c % 3 === 2 && L.climbNext)
        return subst(L.climbNext, { ex: DATA.exercises[id].name.toLowerCase() });
    }
    if(totalCount() === 0 && L.firstEver) return L.firstEver;
    var lead = sess.exercises[0], lid = lead.exerciseId;
    var st = startIndex(lid, lead);
    if(rungIndex(lid, lead) > st && L.liftPlain) return subst(L.liftPlain, {
      sets: slotSets(lead, wb, WEEKCLAMP), reps: slotReps(lead, WEEKCLAMP),
      ex: DATA.exercises[lid].name.toLowerCase(), weight: currentWeight(lid, lead),
      from: DATA.exercises[lid].ladder[st] });
    if(L.liftToday) return subst(L.liftToday, { session: sess.title });
    return "";
  }
  if(!lift){
    var base = key === "open" ? (L.classDay || "") : (key === "rest" ? (L.restDay || "") : "");
    var nl = nextLiftDate();
    if(nl && L.nextUp) base += subst(L.nextUp, {
      day: nl.toLocaleDateString("en-US", { weekday: "long" }),
      session: DATA.sessions[sessionKeyFor(nl)].title });
    return base;
  }
  return "";
}
